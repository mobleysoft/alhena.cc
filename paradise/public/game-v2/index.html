<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071421">
<title>Paradise Fishing V2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #06101a; color: #f8ebc7; font-family: ui-sans-serif, system-ui, sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
body { touch-action: none; }
.hud {
  position: fixed;
  left: 18px;
  top: 18px;
  z-index: 10;
  width: min(390px, calc(100vw - 36px));
  padding: 16px;
  border: 1px solid rgba(255, 233, 180, .22);
  border-radius: 18px;
  background: rgba(4, 13, 22, .54);
  backdrop-filter: blur(16px) saturate(1.2);
  box-shadow: 0 22px 80px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.08);
}
.kicker { color: rgba(255, 215, 126, .76); font-size: 10px; letter-spacing: .24em; text-transform: uppercase; }
h1 { margin-top: 8px; font-family: Georgia, serif; font-size: 30px; line-height: .95; font-weight: 500; }
p { margin-top: 10px; color: rgba(248, 235, 199, .72); font-size: 13px; line-height: 1.55; }
.status { min-height: 36px; }
.meter {
  height: 7px;
  margin-top: 12px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(255,255,255,.10);
}
.meter span {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #53d8ef, #f0cb66, #e85e4c);
}
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
button {
  border: 1px solid rgba(255, 233, 180, .26);
  border-radius: 999px;
  padding: 9px 12px;
  background: rgba(255,255,255,.07);
  color: inherit;
  font: inherit;
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  cursor: pointer;
}
button.active { border-color: rgba(255, 220, 116, .75); background: rgba(255, 213, 111, .18); }
body.clean .hud,
body.clean .caption {
  opacity: 0;
  pointer-events: none;
}
.caption {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 10;
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(4, 13, 22, .48);
  border: 1px solid rgba(255, 233, 180, .18);
  color: rgba(248,235,199,.64);
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  white-space: nowrap;
}
.mobile-controls {
  position: fixed;
  right: max(14px, env(safe-area-inset-right));
  bottom: max(14px, env(safe-area-inset-bottom));
  z-index: 12;
  display: none;
  grid-template-columns: repeat(2, minmax(82px, 1fr));
  gap: 9px;
  width: min(250px, calc(100vw - 28px));
}
.mobile-controls button {
  min-height: 52px;
  border-radius: 16px;
  background: rgba(5, 18, 28, .50);
  backdrop-filter: blur(12px) saturate(1.2);
  box-shadow: inset 0 1px rgba(255,255,255,.08), 0 10px 34px rgba(0,0,0,.22);
}
@media (max-width: 700px) {
  .hud { left: 10px; top: 10px; padding: 12px; }
  h1 { font-size: 24px; }
  p { font-size: 12px; }
  .caption { max-width: calc(100vw - 20px); white-space: normal; text-align: center; }
}
@media (pointer: coarse), (max-height: 520px) {
  .hud { width: min(340px, calc(100vw - 300px)); }
  .mobile-controls { display: grid; }
  body.clean .mobile-controls { opacity: 0; pointer-events: none; }
}
@media (max-width: 760px) {
  .hud { width: min(310px, calc(100vw - 220px)); }
  .mobile-controls { width: min(210px, 42vw); }
  .mobile-controls button { min-height: 46px; font-size: 9px; padding: 8px; }
}
</style>
</head>
<body>
<div class="hud">
  <div class="kicker">Paradise V2 · real 3D architecture</div>
  <h1>Shoreline rebuild</h1>
  <p class="status" id="status">Cast past the foam line. When the bobber dives, reel before the tension breaks.</p>
  <div class="meter"><span id="meter"></span></div>
  <div class="row">
    <button id="cast">Cast</button>
    <button id="reel">Reel</button>
    <button data-view="shore" class="active">Shore</button>
    <button data-view="water">Water</button>
    <button data-view="bar">Bar</button>
    <button data-view="dog">Dog</button>
  </div>
  <div class="row" aria-label="Time presets">
    <button data-time="dawn">Dawn</button>
    <button data-time="noon">Noon</button>
    <button data-time="sunset">Sunset</button>
    <button data-time="night">Night</button>
  </div>
  <div class="row" aria-label="Weather presets">
    <button data-weather="calm">Calm</button>
    <button data-weather="breeze">Breeze</button>
    <button data-weather="storm">Storm</button>
  </div>
</div>
<div class="caption">Space/tap casts and reels · drag to orbit · wheel to dolly</div>
<div class="mobile-controls" aria-label="Fishing controls">
  <button id="touch-cast">Cast</button>
  <button id="touch-reel">Reel</button>
  <button id="touch-clear">Clear</button>
  <button id="touch-view">View</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const query = new URLSearchParams(location.search);
const cinematic = query.get('quality') === 'cinematic';
document.body.classList.toggle('clean', query.get('clean') === '1');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, cinematic ? 2 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = cinematic ? 1.12 : 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(cinematic ? 0x78bdd5 : 0x91cfe0);
scene.fog = new THREE.FogExp2(0x9fd0dc, cinematic ? 0.0034 : 0.0065);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.05, 650);
camera.position.set(13.0, 4.2, 17.5);

const composer = cinematic ? new EffectComposer(renderer) : null;
if (composer) {
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.12, 0.28, 0.96);
  bloom.name = 'v2-cinematic-sun-water-bloom';
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-1.2, .75, -8.5);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.maxPolarAngle = Math.PI * .49;
controls.minDistance = 3;
controls.maxDistance = 58;
controls.enablePan = false;

const hemi = new THREE.HemisphereLight(0xd8fbff, 0xa06f33, cinematic ? 1.42 : 1.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffcf83, 4.2);
sun.position.set(-18, 24, 18);
sun.castShadow = true;
sun.shadow.bias = -0.00018;
sun.shadow.normalBias = 0.035;
sun.shadow.mapSize.set(cinematic ? 4096 : 2048, cinematic ? 4096 : 2048);
sun.shadow.camera.left = -35;
sun.shadow.camera.right = 35;
sun.shadow.camera.top = 25;
sun.shadow.camera.bottom = -25;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 90;
scene.add(sun);

const oceanFill = new THREE.DirectionalLight(0x9fdfff, cinematic ? 1.15 : .72);
oceanFill.name = 'v2-soft-ocean-bounce-fill';
oceanFill.position.set(22, 7, -18);
scene.add(oceanFill);

const barPractical = new THREE.PointLight(0xffba62, cinematic ? 2.6 : 1.6, 13, 1.9);
barPractical.name = 'v2-warm-bar-practical-light';
barPractical.position.set(7.7, 2.6, 3.8);
scene.add(barPractical);

const housePractical = new THREE.PointLight(0xffc871, cinematic ? 1.9 : 1.15, 10, 2.0);
housePractical.name = 'v2-warm-house-window-light';
housePractical.position.set(-11.2, 1.7, 6.1);
scene.add(housePractical);

const skyUniforms = {
  uSunDir: { value: sun.position.clone().normalize() },
  uZenith: { value: new THREE.Color(0x3a94d1) },
  uHorizon: { value: new THREE.Color(0xf5ba61) },
  uLower: { value: new THREE.Color(0x78b8c2) },
  uCloud: { value: 0.23 },
  uSunBloom: { value: 1.0 }
};

const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(360, 64, 32),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: skyUniforms,
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vDir = normalize(world.xyz);
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `,
    fragmentShader: `
      precision highp float;
      uniform vec3 uSunDir;
      uniform vec3 uZenith;
      uniform vec3 uHorizon;
      uniform vec3 uLower;
      uniform float uCloud;
      uniform float uSunBloom;
      varying vec3 vDir;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p), u = f*f*(3.0-2.0*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p) {
        float v = 0.0, a = .5;
        for (int i = 0; i < 5; i++) {
          v += noise(p) * a;
          p = mat2(1.86,-.72,.72,1.86) * p + 4.1;
          a *= .48;
        }
        return v;
      }
      void main() {
        float h = clamp(vDir.y * .5 + .5, 0.0, 1.0);
        vec3 sky = mix(uLower, uZenith, smoothstep(.48, 1.0, h));
        sky = mix(uHorizon, sky, smoothstep(.40, .62, h));
        float sd = max(dot(normalize(vDir), normalize(uSunDir)), 0.0);
        sky += vec3(1.0, .78, .38) * pow(sd, 620.0) * 3.4 * uSunBloom;
        sky += vec3(1.0, .66, .30) * pow(sd, 7.0) * .42 * uSunBloom;
        vec2 cloudUv = vec2(atan(vDir.z, vDir.x) * .9, h * 3.4);
        float clouds = smoothstep(.57, .76, fbm(cloudUv * vec2(2.5, 1.1)));
        clouds *= smoothstep(.52, .72, h) * (1.0 - smoothstep(.90, 1.0, h));
        sky = mix(sky, vec3(.94,.98,1.0), clouds * uCloud);
        sky = sky / (sky + vec3(1.0));
        sky = pow(sky, vec3(1.0 / 2.2));
        gl_FragColor = vec4(sky, 1.0);
      }
    `
  })
);
skyDome.name = 'v2-procedural-sky-dome';
scene.add(skyDome);

const sunDisk = new THREE.Mesh(
  new THREE.CircleGeometry(6.0, 64),
  new THREE.MeshBasicMaterial({ color: 0xffe69b, transparent: true, opacity: .82, depthWrite: false, fog: false })
);
sunDisk.name = 'v2-low-sun-disk';
sunDisk.position.set(-68, 48, -155);
scene.add(sunDisk);

const sunGlow = new THREE.Mesh(
  new THREE.CircleGeometry(20, 96),
  new THREE.MeshBasicMaterial({ color: 0xffce77, transparent: true, opacity: .055, depthWrite: false, fog: false, blending: THREE.AdditiveBlending })
);
sunGlow.name = 'v2-volumetric-sun-glow';
sunGlow.position.copy(sunDisk.position);
scene.add(sunGlow);

function makeTexture(size, painter) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  painter(ctx, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.anisotropy = 8;
  return texture;
}

const sandTex = makeTexture(1024, (ctx, s) => {
  const g = ctx.createLinearGradient(0, 0, s, s);
  g.addColorStop(0, '#f1d79b');
  g.addColorStop(.45, '#d1aa60');
  g.addColorStop(1, '#9a7438');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 16000; i++) {
    const a = .035 + Math.random() * .18;
    ctx.fillStyle = Math.random() > .55 ? `rgba(255,239,184,${a})` : `rgba(76,54,28,${a})`;
    ctx.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2.5, 1);
  }
  for (let i = 0; i < 700; i++) {
    ctx.strokeStyle = `rgba(58,40,19,${.035 + Math.random() * .07})`;
    ctx.beginPath();
    const x = Math.random() * s, y = Math.random() * s;
    ctx.moveTo(x, y);
    ctx.lineTo(x + 10 + Math.random() * 42, y + Math.random() * 5 - 2.5);
    ctx.stroke();
  }
});
sandTex.repeat.set(6, 4);

const woodTex = makeTexture(1024, (ctx, s) => {
  ctx.fillStyle = '#7b4a26';
  ctx.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 9) {
    ctx.strokeStyle = y % 27 ? 'rgba(255,206,126,.08)' : 'rgba(35,18,9,.25)';
    ctx.beginPath();
    ctx.moveTo(0, y + Math.sin(y * .04) * 3);
    ctx.lineTo(s, y + Math.cos(y * .05) * 4);
    ctx.stroke();
  }
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = `rgba(30,16,8,${.035 + Math.random() * .08})`;
    ctx.fillRect(Math.random() * s, Math.random() * s, 12 + Math.random() * 58, 1);
  }
});
woodTex.repeat.set(2.8, 1.0);

const clothTex = makeTexture(512, (ctx, s) => {
  ctx.fillStyle = '#2f9eb5';
  ctx.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 6) {
    ctx.strokeStyle = y % 18 ? 'rgba(255,255,255,.055)' : 'rgba(5,42,55,.13)';
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(s, y + Math.sin(y * .05) * 2);
    ctx.stroke();
  }
  for (let x = 0; x < s; x += 9) {
    ctx.strokeStyle = 'rgba(0,30,42,.07)';
    ctx.beginPath();
    ctx.moveTo(x + Math.sin(x) * 2, 0);
    ctx.lineTo(x, s);
    ctx.stroke();
  }
});
clothTex.repeat.set(1.4, 1.9);

const apronTex = makeTexture(512, (ctx, s) => {
  ctx.fillStyle = '#d0ac62';
  ctx.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 18) {
    ctx.strokeStyle = 'rgba(255,244,196,.18)';
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(s, y);
    ctx.stroke();
  }
  for (let x = 0; x < s; x += 22) {
    ctx.strokeStyle = 'rgba(92,62,22,.12)';
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, s);
    ctx.stroke();
  }
});
apronTex.repeat.set(1.2, 1.2);

const furTex = makeTexture(512, (ctx, s) => {
  ctx.fillStyle = '#080706';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 4200; i++) {
    const light = Math.random() > .82;
    ctx.strokeStyle = light ? 'rgba(125,104,78,.16)' : 'rgba(0,0,0,.22)';
    const x = Math.random() * s;
    const y = Math.random() * s;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 2 + Math.random() * 10, y + Math.random() * 4 - 2);
    ctx.stroke();
  }
});
furTex.repeat.set(1.8, 1.0);

const sandMat = new THREE.MeshStandardMaterial({ map: sandTex, bumpMap: sandTex, bumpScale: .09, roughness: .95, color: 0xd8b46e });
const wetSandMat = new THREE.MeshPhysicalMaterial({ color: 0x8aa9a1, roughness: .28, metalness: .02, clearcoat: .4, clearcoatRoughness: .25, transparent: true, opacity: .64 });
const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, bumpMap: woodTex, bumpScale: .055, roughness: .76, color: 0x8e6036 });
const darkWoodMat = new THREE.MeshStandardMaterial({ map: woodTex, bumpMap: woodTex, bumpScale: .04, roughness: .82, color: 0x5a351d });
const barFaceMat = new THREE.MeshStandardMaterial({ map: woodTex, bumpMap: woodTex, bumpScale: .05, roughness: .78, color: 0x6f3f24 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xbaedf1, roughness: .04, transmission: .45, thickness: .4, transparent: true, opacity: .66, emissive: 0x183840, emissiveIntensity: .10 });
const clothMat = new THREE.MeshStandardMaterial({ map: clothTex, bumpMap: clothTex, bumpScale: .025, color: 0x43abc1, roughness: .72 });
const apronMat = new THREE.MeshStandardMaterial({ map: apronTex, bumpMap: apronTex, bumpScale: .018, color: 0xd9b66e, roughness: .78 });
const skinMat = new THREE.MeshStandardMaterial({ color: 0x7a4b35, roughness: .7 });
const furMat = new THREE.MeshStandardMaterial({ map: furTex, bumpMap: furTex, bumpScale: .038, color: 0x100d0c, roughness: .55, metalness: .02 });
const furRimMat = new THREE.MeshStandardMaterial({ map: furTex, bumpMap: furTex, bumpScale: .030, color: 0x3b2f27, roughness: .50, metalness: .03 });
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x080504 });

const oceanUniforms = {
  uTime: { value: 0 },
  uWind: { value: 10.8 },
  uChop: { value: 1.0 },
  uSun: { value: sun.position.clone().normalize() },
  uSky: { value: new THREE.Color(0x9fd6e6) },
  uHorizon: { value: new THREE.Color(0xffd08a) },
  uDeep: { value: new THREE.Color(0x00061d) },
  uMid: { value: new THREE.Color(0x011a34) },
  uShallow: { value: new THREE.Color(0x053e50) },
  uFogTint: { value: new THREE.Color(0x9ecbd9) },
  uFoamPower: { value: 1.0 },
  uGold: { value: 1.0 }
};

const oceanMat = new THREE.ShaderMaterial({
  uniforms: oceanUniforms,
  vertexShader: `
    uniform float uTime;
    uniform float uWind;
    uniform float uChop;
    varying vec3 vWorld;
    varying vec2 vUv;
    varying float vCrest;
    varying float vHeight;
    varying float vShore;
    varying vec3 vNormal;
    varying float vSlope;
    const float PI = 3.14159265359;
    const float G = 9.81;
    float hash(float n) { return fract(sin(n) * 43758.5453123); }
    float jonswap(float omega, float wp) {
      float sigma = omega <= wp ? .07 : .09;
      float peak = exp(-pow(omega - wp, 2.0) / (2.0 * sigma * sigma * wp * wp));
      return 0.0081 * G * G / pow(omega, 5.0) * exp(-1.25 * pow(wp / omega, 4.0)) * pow(3.3, peak);
    }
    void component(float i, out vec2 dir, out float k, out float omega, out float amp, out float phase) {
      float t = i / 47.0;
      float wind = uWind;
      float wp = 0.13 * G / wind * 6.28318530718;
      float wMin = wp * .38;
      float wMax = wp * 7.8;
      omega = wMin * pow(wMax / wMin, t);
      k = omega * omega / G;
      float spectrum = jonswap(omega, wp);
      float spread = mix(1.18, .18, smoothstep(0.0, 1.0, t));
      float theta = -PI * .5 + (t - .5) * PI * spread + .25 + (hash(i * 8.31) - .5) * .46;
      dir = normalize(vec2(cos(theta), sin(theta)));
      amp = clamp(sqrt(2.0 * spectrum * ((wMax - wMin) / 48.0)) * .88 * wind / 12.0, 0.0, 2.35);
      phase = hash(i * 19.19 + 3.7) * 6.28318530718;
    }
    void main() {
      vUv = uv;
      vec3 p = position;
      vec2 wp = p.xz * .15;
      float h = 0.0;
      vec2 lateral = vec2(0.0);
      vec2 grad = vec2(0.0);
      float crest = 0.0;
      for (int j = 0; j < 48; j++) {
        float i = float(j);
        vec2 dir; float k; float omega; float amp; float phase;
        component(i, dir, k, omega, amp, phase);
        float a = dot(dir, wp) * k - omega * uTime + phase;
        h += amp * sin(a);
        float ca = cos(a);
        lateral += dir * ca * amp * (.22 + .16 * uChop);
        grad += dir * (amp * k * ca);
        crest += abs(amp * k * ca);
      }
      float shoreFade = smoothstep(-1.0, -9.0, p.z);
      float backSwell = sin(p.x * .035 - uTime * .20) * .28 + sin(p.z * .05 + p.x * .018 + uTime * .12) * .18;
      h += backSwell * shoreFade;
      p.xz += lateral * shoreFade;
      p.y += h * (.50 + shoreFade * .98);
      vHeight = h;
      vShore = shoreFade;
      vSlope = clamp(length(grad) * .55, 0.0, 1.0);
      vCrest = clamp(crest * .28 + max(h, 0.0) * .12 + vSlope * .22, 0.0, 1.0);
      vec4 world = modelMatrix * vec4(p, 1.0);
      vWorld = world.xyz;
      vNormal = normalize(normalMatrix * vec3(-grad.x * shoreFade, 1.0, -grad.y * shoreFade));
      gl_Position = projectionMatrix * viewMatrix * world;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform float uTime;
    uniform vec3 uSun;
    uniform vec3 uSky;
    uniform vec3 uHorizon;
    uniform vec3 uDeep;
    uniform vec3 uMid;
    uniform vec3 uShallow;
    uniform vec3 uFogTint;
    uniform float uFoamPower;
    uniform float uGold;
    varying vec3 vWorld;
    varying vec2 vUv;
    varying float vCrest;
    varying float vHeight;
    varying float vShore;
    varying vec3 vNormal;
    varying float vSlope;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p), u = f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = .5;
      for (int i = 0; i < 5; i++) {
        v += noise(p) * a;
        p = mat2(1.7,-1.1,1.1,1.7) * p + 9.4;
        a *= .48;
      }
      return v;
    }
    void main() {
      vec3 n = normalize(vNormal);
      vec2 windUv = vWorld.xz;
      vec2 swellUv = vec2(windUv.x * .055 - uTime * .018, windUv.y * .24 + uTime * .045);
      vec2 chopUv = vec2(windUv.x * .42 + windUv.y * .08 - uTime * .12, windUv.y * .95 + uTime * .18);
      vec2 rippleUv = windUv * vec2(3.2, 1.35) + vec2(uTime * .35, -uTime * .12);
      vec2 micro = vec2(fbm(chopUv), fbm(chopUv.yx + 8.0)) - .5;
      vec2 ripple = vec2(fbm(rippleUv), fbm(rippleUv.yx + 3.7)) - .5;
      vec2 capillary = vec2(
        sin(windUv.x * 21.0 - uTime * 2.7) + sin(dot(windUv, vec2(.7, 1.4)) * 17.0 - uTime * 2.1),
        cos(windUv.y * 19.0 - uTime * 2.2) + sin(dot(windUv, vec2(1.3, -.5)) * 23.0 + uTime * 2.4)
      ) * .015;
      n = normalize(n + vec3(micro.x, 0.0, micro.y) * .34 + vec3(ripple.x, 0.0, ripple.y) * .09 + vec3(capillary.x, 0.0, capillary.y));
      vec3 v = normalize(cameraPosition - vWorld);
      vec3 r = reflect(-v, n);
      float facing = clamp(dot(n, v), 0.0, 1.0);
      float fresnel = .0204 + .9796 * pow(1.0 - facing, 5.0);
      float depth = smoothstep(2.5, -104.0, vWorld.z);
      vec3 deep = uDeep;
      vec3 mid = uMid;
      vec3 shallow = uShallow;
      float opticalDepth = 1.0 - exp(-depth * 3.2);
      vec3 body = mix(shallow * .52, deep * 1.42, opticalDepth);
      body = mix(body, mid * .70, smoothstep(.10, .70, 1.0 - abs(depth - .45)));
      float backScatter = pow(max(dot(n, -normalize(uSun)), 0.0), 1.45) * (1.0 - opticalDepth) * (0.85 + vShore * .55);
      float forwardScatter = pow(max(dot(normalize(uSun), v), 0.0), 4.2) * (1.0 - depth);
      body += vec3(.040, .43, .35) * backScatter * .72;
      body += vec3(.12, .52, .46) * forwardScatter * .28;
      body += vec3(.020, .090, .075) * smoothstep(-.22, .62, vHeight) * (1.0 - depth);

      float horizonBand = smoothstep(-.16, .72, r.y);
      vec3 zenithReflection = mix(vec3(.08,.23,.31), uSky * .44, horizonBand);
      float sunMirror = pow(max(dot(r, normalize(uSun)), 0.0), 76.0);
      float sunBloom = pow(max(dot(r, normalize(uSun)), 0.0), 9.0);
      vec3 reflectedSky = mix(zenithReflection, uHorizon * .62, sunBloom * .24);
      reflectedSky += vec3(1.0, .83, .46) * sunMirror * 1.55 * uGold;

      float reflectionWeight = clamp(fresnel * .52 + (1.0 - facing) * .13 + vSlope * .075, 0.0, .58);
      vec3 col = mix(body, reflectedSky, reflectionWeight);
      float specTight = pow(max(dot(reflect(-normalize(uSun), n), v), 0.0), 320.0) * 4.2 * uGold;
      float specWide = pow(max(dot(reflect(-normalize(uSun), n), v), 0.0), 48.0) * .56 * uGold;
      float longRipple = smoothstep(.48, .78, fbm(swellUv + vec2(0.0, uTime * .02)));
      float glitterMask = smoothstep(.66, .96, fbm(windUv * vec2(5.8, 1.65) + vec2(uTime * .34, -uTime * .13)));
      float glitter = glitterMask * pow(max(dot(reflect(-normalize(uSun), n), v), 0.0), 16.0) * 1.25;

      float whitecapNoise = fbm(windUv * .72 + vec2(uTime * .10, -uTime * .04));
      float foam = smoothstep(.42, .82, vCrest + vSlope * .28) * smoothstep(.40, .72, whitecapNoise);
      float streaks = smoothstep(.62, .84, fbm(vec2(windUv.x * .16 - uTime * .040, windUv.y * 1.9 + uTime * .16)));
      float shoreNoise = fbm(vec2(vWorld.x * 1.75, uTime * .68 + sin(vWorld.x * .07) * .2));
      float shoreFoam = smoothstep(-9.8, -2.0, vWorld.z) * smoothstep(.44, .76, shoreNoise);
      float banding = smoothstep(.38, .78, fbm(vec2(windUv.x * .022 - uTime * .012, windUv.y * .42 + uTime * .045)));
      col *= mix(.72, 1.16, banding);
      col += vec3(.030, .18, .21) * longRipple * (1.0 - depth) * .50;
      col += vec3(1.0, .91, .62) * (specTight + specWide + glitter);
      col = mix(col, vec3(.92,.985,1.0), clamp((foam * .62 + shoreFoam * .34 + streaks * foam * .22) * uFoamPower, 0.0, .78));

      float haze = smoothstep(-34.0, -150.0, vWorld.z);
      col = mix(col, uFogTint * .58, haze * .045);
      col = mix(col, vec3(.84,.95,.97), smoothstep(.8, 0.0, cameraPosition.y) * .065);
      col = max(col, vec3(0.0));
      col = pow(col, vec3(.86));
      col = vec3(1.0) - exp(-col * .88);
      col = pow(col, vec3(1.0 / 2.2));
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  transparent: false
});

  vertexShader: `
    uniform float uTime;
    varying vec3 vWorld;
    varying float vLift;
    const float PI = 3.14159265359;
    const float G = 9.81;
    float hash(float n) { return fract(sin(n) * 43758.5453123); }
    void wave(float i, out vec2 dir, out float k, out float omega, out float amp, out float phase) {
      float t = i / 18.0;
      float wind = 10.8;
      float wp = 0.13 * G / wind * 6.28318530718;
      float wMin = wp * .52;
      float wMax = wp * 5.4;
      omega = wMin * pow(wMax / wMin, t);
      k = omega * omega / G;
      float sigma = omega <= wp ? .07 : .09;
      float peak = exp(-pow(omega - wp, 2.0) / (2.0 * sigma * sigma * wp * wp));
      float spectrum = 0.0081 * G * G / pow(omega, 5.0) * exp(-1.25 * pow(wp / omega, 4.0)) * pow(3.3, peak);
      float theta = -PI * .5 + (t - .5) * PI * .72 + .25 + (hash(i * 6.13) - .5) * .45;
      dir = normalize(vec2(cos(theta), sin(theta)));
      amp = clamp(sqrt(2.0 * spectrum * ((wMax - wMin) / 18.0)) * .62 * wind / 12.0, 0.0, 1.4);
      phase = hash(i * 17.41 + 2.3) * 6.28318530718;
    }
    void main() {
      vec3 p = position;
      vec2 wp = p.xz * .15;
      float h = 0.0;
      for (int j = 0; j < 18; j++) {
        vec2 dir; float k; float omega; float amp; float phase;
        wave(float(j), dir, k, omega, amp, phase);
        h += amp * sin(dot(dir, wp) * k - omega * uTime + phase);
      }
      float shoreFade = smoothstep(-1.0, -11.0, p.z);
      p.y += h * (.24 + shoreFade * .64);
      vLift = h;
      vec4 world = modelMatrix * vec4(p, 1.0);
      vWorld = world.xyz;
      gl_Position = projectionMatrix * viewMatrix * world;
    }

  fragmentShader: `
    precision highp float;
    uniform float uTime;
    uniform vec3 uSun;
    uniform float uOpticsPower;
    varying vec3 vWorld;
    varying float vLift;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p), u = f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);

    }

async function installRuntimeAssetSlots() {
  try {
    window.__paradiseV2AssetCount = 0;
    const response = await fetch('/assets/paradise-asset-manifest.json', { cache: 'no-store' });
    if (!response.ok) throw new Error(`manifest ${response.status}`);
    const manifest = await response.json();
    const loader = new GLTFLoader();
    const slots = manifest.assets || [];
    for (const slot of slots) {
      const path = slot.targetPath || '';
      const assetExistsByContract = slot.status === 'active' || slot.status === 'candidate' || slot.loadByDefault;
      const requested = (query.get('assets') === '1' && assetExistsByContract) || query.get(`asset_${slot.id}`) === '1';
      const shouldLoad = path.endsWith('.glb') && (slot.loadByDefault || requested);
      if (!shouldLoad) continue;
      const preflight = await fetch(path, { method: 'HEAD', cache: 'no-store' });
      if (!preflight.ok) {
        console.warn(`Skipping ${slot.id}: ${path} returned ${preflight.status}`);
        continue;
      }
      loader.load(path, gltf => {
        const root = gltf.scene;
        root.name = `v2-runtime-asset-${slot.id}`;
        root.traverse(node => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            if (node.material) node.material.needsUpdate = true;
          }
        });
        scene.add(root);
        if (slot.id === 'alhena_bartender_rig' && slot.status === 'active') alhena.visible = false;
        if (slot.id === 'black_lab_rig' && slot.status === 'active') dog.visible = false;
        if (slot.id === 'shoreline_environment' && query.get('replace') === '1') {
          beach.visible = false;
          wet.visible = false;
          dock.visible = false;
        }
        window.__paradiseV2AssetCount += 1;
        setStatus(`Loaded ${slot.id} runtime asset.`);
      }, undefined, error => {
        console.warn(`Could not load ${slot.id}`, error);
      });
    }
  } catch (error) {
    console.warn('Runtime asset manifest unavailable', error);
  }
}

}

function reelLine() {
  if (!play.cast) return castLine();
  if (!play.bite) {
    play.tension = Math.min(1, play.tension + .16);
    setStatus('Too early. Let the bite develop before reeling.');
    return;
  }
  play.tension += .28;
  if (play.tension > .62 && play.tension < 1.05) {
    play.catches += 1;
    setStatus(`Caught ${play.species.name} x${play.catches}. Cast again.`);
    clearLine();
  } else if (play.tension >= 1.05) {
    setStatus('Line snapped. Reset and cast again.');
    clearLine();
  } else {
    setStatus('Reel again. Keep tension in the strike window.');
  }
}

function sampleOceanHeight(x, z, t) {
  const wind = weatherPresets[activeWeather]?.wind || 10.8;
  const g = 9.81;
  const wp = 0.13 * g / wind * Math.PI * 2;
  const wMin = wp * .38;
  const wMax = wp * 7.8;
  let h = 0;
  for (let j = 0; j < 48; j++) {
    const n = j;
    const u = n / 47;
    const omega = wMin * Math.pow(wMax / wMin, u);
    const k = omega * omega / g;
    const sigma = omega <= wp ? .07 : .09;
    const peak = Math.exp(-Math.pow(omega - wp, 2) / (2 * sigma * sigma * wp * wp));
    const spectrum = 0.0081 * g * g / Math.pow(omega, 5) * Math.exp(-1.25 * Math.pow(wp / omega, 4)) * Math.pow(3.3, peak);
    const spread = 1.18 + (.18 - 1.18) * u;
    const seed = Math.sin(n * 8.31) * 43758.5453123;
    const hash = seed - Math.floor(seed);
    const theta = -Math.PI * .5 + (u - .5) * Math.PI * spread + .25 + (hash - .5) * .46;
    const dx = Math.cos(theta);
    const dz = Math.sin(theta);
    const amp = Math.min(2.35, Math.max(0, Math.sqrt(2 * spectrum * ((wMax - wMin) / 48)) * .88 * wind / 12));
    const phaseSeed = Math.sin(n * 19.19 + 3.7) * 43758.5453123;
    const phase = (phaseSeed - Math.floor(phaseSeed)) * Math.PI * 2;
    h += amp * Math.sin((dx * x + dz * z) * .15 * k - omega * t + phase);
  }
  h += (Math.sin(x * .035 - t * .20) * .28 + Math.sin(z * .05 + x * .018 + t * .12) * .18) * THREE.MathUtils.smoothstep(z, -1.0, -9.0);
  const shoreFade = 1 - THREE.MathUtils.smoothstep(z, -9.0, -1.0);
  return -.12 + h * (.50 + shoreFade * .98);
}

  });
  alhena.userData.tray.position.y = .02 + Math.sin(t * 1.0) * .012;
  alhena.userData.drink.position.y = .13 + Math.sin(t * 1.0) * .012;
  alhena.userData.drinkGlow.position.y = .18 + Math.sin(t * 1.0) * .012;
  alhena.userData.necklace.rotation.z = Math.sin(t * .9) * .035;
  alhena.userData.smile.scale.x = 1.0 + (play.bite ? .12 : Math.sin(t * .7) * .03);
  dog.position.x = 1.6 + Math.sin(t * .55) * .42;
  dog.position.y = .43 + Math.max(0, Math.sin(t * 2.2)) * .025;
  dog.rotation.y = -.16 + Math.sin(t * .55 + .7) * .28;
  dog.userData.body.scale.y = .82 + Math.sin(t * 1.6) * .018;
  dog.userData.chest.position.y = .02 + Math.sin(t * 1.6 + .4) * .012;
  dog.userData.haunch.position.y = Math.sin(t * 1.6 + 1.1) * .010;
  dog.userData.head.rotation.y = Math.sin(t * 1.1) * .22 + (play.bite ? .18 : 0);
  dog.userData.head.rotation.x = -.08 + Math.sin(t * .74) * .06 + (play.bite ? -.10 : 0);
  dog.userData.tail.rotation.z = 1.0 + Math.sin(t * (play.bite ? 7.4 : 5.2)) * (play.bite ? .48 : .34);
  dog.userData.tail.rotation.y = Math.sin(t * 3.2) * .14;
  dog.userData.ears.forEach((ear, i) => {
    ear.rotation.z = Math.sin(t * 2.1 + i) * .06 + (play.bite ? (i ? -.06 : .06) : 0);
  });
  dog.userData.legs.forEach((leg, i) => {
    const gait = Math.sin(t * 4.3 + i * Math.PI * .5);
    const lift = Math.max(0, gait);
    leg.rotation.x = gait * .34;
    leg.rotation.z = (i < 2 ? -.08 : .08) + Math.sin(t * 2.1 + i) * .035;
    dog.userData.joints[i].hock.rotation.x = -gait * .22;
    dog.userData.joints[i].hock.position.y = -.50 + lift * .032;
    dog.userData.joints[i].shoulder.position.y = -.16 + Math.sin(t * 4.3 + i * Math.PI * .5) * .015;
    dog.userData.paws[i].position.y = -.57 + lift * .060;
    dog.userData.paws[i].position.x = (i < 2 ? -.42 : .42) + .05 + Math.cos(t * 4.3 + i) * .038;
  });
  if (play.cast && !play.bite && now > play.biteAt) {
    play.bite = true;
    play.tension = .18;
    setStatus('Bite. Reel now.');
  }
  if (play.cast) {
    const fly = Math.min(1, (now - play.castAt) / 720);
    const ease = 1 - Math.pow(1 - fly, 3);
    bobber.position.lerpVectors(new THREE.Vector3(10.8, 1.55, 3.4), play.target, ease);
    const waterY = sampleOceanHeight(bobber.position.x, bobber.position.z, t);
    bobber.position.y = waterY + (play.bite ? -.08 : .18) + Math.sin(t * 1.7) * .035 - play.tension * .035;
    if (play.bite) play.tension = Math.min(1.18, play.tension + .14 * dt);
  } else {
    bobber.position.set(10.8, 1.55 + Math.sin(t * 1.6) * .025, 3.4);
  }
  red.position.copy(bobber.position);
  const linePos = fishingLine.geometry.attributes.position;
  linePos.setXYZ(0, rodTip.x, rodTip.y, rodTip.z);
  linePos.setXYZ(1, (rodTip.x + bobber.position.x) * .5, Math.max(.35, (rodTip.y + bobber.position.y) * .5 - .6), (rodTip.z + bobber.position.z) * .5);
  linePos.setXYZ(2, bobber.position.x, bobber.position.y, bobber.position.z);
  linePos.needsUpdate = true;
  meterEl.style.width = `${Math.round(Math.min(1, play.tension) * 100)}%`;
  if (play.cast && play.bite && play.tension >= 1.1) {
    setStatus('The fish shook loose. Cast again.');
    clearLine();
  }
  fish.forEach((f, i) => {
    f.position.x += Math.sin(t * f.userData.speed + f.userData.phase) * .008;
    f.position.y = sampleOceanHeight(f.position.x, f.position.z, t) - f.userData.depth + Math.sin(t * .8 + i) * .08;
    f.rotation.y = Math.sin(t * .6 + i) * .18;
  });
  shoreFoam.forEach(line => {
    const pos = line.geometry.attributes.position;
    const base = line.userData.base;
    const row = line.userData.row;
    for (let i = 0; i < pos.count; i++) {
      const p = base[i];
      pos.setXYZ(i, p.x, p.y + Math.sin(t * 1.3 + i * .11 + row) * .006, p.z + Math.sin(t * .8 + i * .17 + row) * .08);
    }
    line.material.opacity = .12 + Math.sin(t * .9 + row) * .035;
    pos.needsUpdate = true;
  });
  if (composer) composer.render();
  else renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
