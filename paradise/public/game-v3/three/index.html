<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07131b">
<title>Paradise V3 - Shader Ocean Composite</title>
<style>
:root {
  --paper: #f7edce;
  --glass: rgba(5, 15, 26, 0.58);
  --line: rgba(247, 237, 206, 0.18);
  --gold: #f0cf7a;
  --cyan: #78d8ed;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07131b; color: var(--paper); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
canvas { display: block; }
.ocean-pass-frame {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100vw;
  height: 100vh;
  border: 0;
  pointer-events: none;
  background: #07131b;
}
body > canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
}
.shoreline-atmosphere {
  position: fixed;
  inset: auto 0 0;
  z-index: 2;
  height: 34vh;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 22% 58%, rgba(255, 238, 171, 0.13), transparent 24%),
    radial-gradient(ellipse at 74% 52%, rgba(255, 224, 159, 0.10), transparent 20%),
    linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(232, 250, 255, 0.07) 16%, rgba(245, 233, 188, 0.22) 40%, rgba(167, 112, 56, 0.22) 100%);
  mix-blend-mode: soft-light;
}
.shoreline-atmosphere::before,
.shoreline-atmosphere::after {
  content: "";
  position: absolute;
  left: -10vw;
  right: -10vw;
  height: 28px;
  border-radius: 50%;
  filter: blur(8px);
  transform: rotate(-1.2deg);
}
.shoreline-atmosphere::before {
  top: 16%;
  background: linear-gradient(90deg, transparent, rgba(238, 254, 255, 0.52), rgba(255, 241, 207, 0.22), transparent);
  opacity: 0.42;
}
.shoreline-atmosphere::after {
  top: 28%;
  background: linear-gradient(90deg, transparent, rgba(255, 248, 226, 0.26), rgba(215, 246, 255, 0.38), transparent);
  opacity: 0.28;
  transform: rotate(0.8deg);
}
body.clean .hud,
body.clean .readout {
  opacity: 0;
  pointer-events: none;
}
.hud {
  position: fixed;
  left: max(16px, env(safe-area-inset-left));
  top: max(16px, env(safe-area-inset-top));
  z-index: 3;
  width: min(420px, calc(100vw - 32px));
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--glass);
  box-shadow: 0 24px 80px rgba(0,0,0,0.32), inset 0 1px rgba(255,255,255,0.08);
  backdrop-filter: blur(18px) saturate(1.2);
}
.kicker {
  color: var(--gold);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .18em;
  text-transform: uppercase;
}
h1 {
  margin: 10px 0 8px;
  font: 500 clamp(28px, 6vw, 56px)/.9 Georgia, "Times New Roman", serif;
  letter-spacing: -.04em;
}
p { margin: 0; color: rgba(247,237,206,.72); line-height: 1.5; font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
button, a.button {
  min-height: 38px;
  padding: 10px 12px;
  border: 1px solid rgba(247,237,206,.24);
  border-radius: 999px;
  background: rgba(255,255,255,.07);
  color: var(--paper);
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: .13em;
  font-size: 10px;
  font-weight: 800;
  cursor: pointer;
}
button.active { color: #07131b; background: linear-gradient(135deg, #fff2b6, #d5a844); border-color: transparent; }
.readout {
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(16px, env(safe-area-inset-bottom));
  z-index: 3;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(5,15,26,.48);
  color: rgba(247,237,206,.68);
  backdrop-filter: blur(14px);
  text-transform: uppercase;
  letter-spacing: .14em;
  font-size: 10px;
}
@media (max-width: 760px) {
  .hud { padding: 14px; }
  .hud p { display: none; }
  .row { margin-top: 10px; }
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"

</script>
</head>
<body data-paradise-v3="shader-ocean-composite" data-water-system="paradise-standalone-pandorachat-jonswap-ocean-v3-composite">
<iframe class="ocean-pass-frame" id="ocean-pass-frame" title="PandoraChat WebGL ocean pass" src="/game-v3/ocean-pass/?time=dawn&amp;weather=breeze"></iframe>
<div class="shoreline-atmosphere" aria-hidden="true"></div>
<aside class="hud">
  <div class="kicker">Paradise V3 / Shader Composite</div>
  <h1>Spectral water pass.</h1>
  <p>This route composes a standalone PandoraChat-style ocean shader behind the game foreground: JONSWAP-inspired wave spectra, analytical normals, Fresnel, scatter, foam, fog, and tone mapping.</p>
  <div class="row">
    <button class="active" data-time="dawn">Dawn</button>
    <button data-time="noon">Noon</button>
    <button data-time="sunset">Sunset</button>
    <button data-time="night">Night</button>
    <a class="button" href="/">Root Game</a>
    <a class="button" href="/game-v3/">V3 Gate</a>
  </div>
</aside>
<div class="readout" id="readout">loading mesh ocean</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const readout = document.getElementById('readout');
const palette = {
  dawn: { sky: 0x8fcde0, horizon: 0xffd89a, sun: 0xffefb4, deep: [0.00, 0.04, 0.10], mid: [0.00, 0.19, 0.28], shallow: [0.05, 0.42, 0.44], fog: 0xaad0d4, light: 1.15, gold: 1.0, wind: 8.4, chop: 0.92, foam: 0.72 },
  noon: { sky: 0x55aeea, horizon: 0xd7eff7, sun: 0xfff5cf, deep: [0.00, 0.05, 0.16], mid: [0.00, 0.23, 0.38], shallow: [0.06, 0.54, 0.56], fog: 0xbfe4ea, light: 1.35, gold: 0.62, wind: 7.6, chop: 0.86, foam: 0.58 },
  sunset: { sky: 0x3f315c, horizon: 0xffb469, sun: 0xffa45a, deep: [0.00, 0.018, 0.064], mid: [0.03, 0.09, 0.16], shallow: [0.18, 0.22, 0.27], fog: 0xa87572, light: 0.95, gold: 1.18, wind: 10.8, chop: 1.08, foam: 0.92 },
  night: { sky: 0x030815, horizon: 0x243c5a, sun: 0xbfdfff, deep: [0.00, 0.006, 0.028], mid: [0.00, 0.04, 0.09], shallow: [0.02, 0.15, 0.20], fog: 0x102035, light: 0.52, gold: 0.18, wind: 6.2, chop: 0.72, foam: 0.45 },
};
let timeKey = new URLSearchParams(location.search).get('time') || 'dawn';
if (!palette[timeKey]) timeKey = 'dawn';
const cleanPresentation = new URLSearchParams(location.search).get('clean') === '1';
document.body.classList.toggle('clean', cleanPresentation);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(palette[timeKey].fog, 0.018);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 900);
camera.position.set(0, 3.85, 19.5);
camera.lookAt(0, 0.45, -34);

const oceanFrame = document.getElementById('ocean-pass-frame');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = false;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
renderer.setClearColor(0x000000, 0);

const hemi = new THREE.HemisphereLight(0xf7f1d6, 0x102033, 1.3);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe0a4, 2.4);
sun.position.set(-9, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -28;
sun.shadow.camera.right = 28;
sun.shadow.camera.top = 24;
sun.shadow.camera.bottom = -24;
scene.add(sun);

const skyGeo = new THREE.SphereGeometry(360, 48, 24);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    topColor: { value: new THREE.Color(palette[timeKey].sky) },
    horizonColor: { value: new THREE.Color(palette[timeKey].horizon) },
    sunColor: { value: new THREE.Color(palette[timeKey].sun) },
    sunDir: { value: new THREE.Vector3(-0.42, 0.62, 0.2).normalize() },
  },
  vertexShader: `
    varying vec3 vWorld;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = normalize(wp.xyz);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vWorld;
    uniform vec3 topColor;
    uniform vec3 horizonColor;
    uniform vec3 sunColor;
    uniform vec3 sunDir;
    void main() {
      float h = clamp(vWorld.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 c = mix(horizonColor, topColor, smoothstep(0.05, 0.82, h));
      float s = pow(max(dot(vWorld, sunDir), 0.0), 360.0);
      float glow = pow(max(dot(vWorld, sunDir), 0.0), 16.0);
      c += sunColor * (s * 2.8 + glow * 0.26);
      gl_FragColor = vec4(c, 1.0);
    }
  `
});
const skyDome = new THREE.Mesh(skyGeo, skyMat);
skyDome.visible = false;
scene.add(skyDome);

function makeGlowTexture(color = 'rgba(255,255,255,1)') {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, color);
  g.addColorStop(0.38, color.replace(/,1\)$/, ',0.42)'));
  g.addColorStop(1, color.replace(/,1\)$/, ',0)'));
  x.fillStyle = g;
  x.fillRect(0, 0, 256, 256);
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function makeRayTexture() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 64;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 512, 0);
  g.addColorStop(0, 'rgba(255,248,210,0)');
  g.addColorStop(0.20, 'rgba(255,248,210,0.16)');
  g.addColorStop(0.52, 'rgba(255,248,210,0.32)');
  g.addColorStop(1, 'rgba(255,248,210,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 512, 64);
  const v = x.createLinearGradient(0, 0, 0, 64);
  v.addColorStop(0, 'rgba(255,255,255,0)');
  v.addColorStop(0.5, 'rgba(255,255,255,1)');
  v.addColorStop(1, 'rgba(255,255,255,0)');
  x.globalCompositeOperation = 'destination-in';
  x.fillStyle = v;
  x.fillRect(0, 0, 512, 64);
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture('rgba(255,233,166,1)'),
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
}));
sunSprite.position.set(-22, 18, -120);
sunSprite.scale.set(16, 16, 1);
scene.add(sunSprite);

const rayMat = new THREE.MeshBasicMaterial({
  map: makeRayTexture(),
  color: 0xffdf93,
  transparent: true,
  opacity: 0.18,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
});
const atmosphereRays = [];
for (let i = 0; i < 5; i++) {
  const ray = new THREE.Mesh(new THREE.PlaneGeometry(32 + i * 9, 2.4 + i * 0.8), rayMat.clone());
  ray.position.set(-13 + i * 6, 7.2 - i * 0.34, -38 + i * 3);
  ray.rotation.set(-0.18, 0.1, -0.22 + i * 0.035);
  ray.userData.rayPhase = i;
  scene.add(ray);
  atmosphereRays.push(ray);
}

const waterUniforms = {
  uTime: { value: 0 },
  uWind: { value: palette[timeKey].wind },
  uChop: { value: palette[timeKey].chop },
  uFoamPower: { value: palette[timeKey].foam },
  uGold: { value: palette[timeKey].gold },
  uSky: { value: new THREE.Color(palette[timeKey].sky) },
  uHorizon: { value: new THREE.Color(palette[timeKey].horizon) },
  uDeep: { value: new THREE.Vector3(...palette[timeKey].deep) },
  uMid: { value: new THREE.Vector3(...palette[timeKey].mid) },
  uShallow: { value: new THREE.Vector3(...palette[timeKey].shallow) },
  uFogTint: { value: new THREE.Color(palette[timeKey].fog) },
  uSun: { value: new THREE.Vector3(-0.42, 0.62, 0.2).normalize() },
};
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  extensions: { derivatives: true },
  transparent: false,
  vertexShader: `
    uniform float uTime;
    uniform float uWind;
    uniform float uChop;
    varying vec3 vWorld;
    varying vec2 vUv;
    varying float vCrest;
    varying float vHeight;
    varying float vShore;
    varying vec3 vNormal;
    varying float vSlope;
    const float PI = 3.14159265359;
    const float G = 9.81;
    float hash(float n) { return fract(sin(n) * 43758.5453123); }
    float jonswap(float omega, float wp) {
      float sigma = omega <= wp ? .07 : .09;
      float peak = exp(-pow(omega - wp, 2.0) / (2.0 * sigma * sigma * wp * wp));
      return 0.0081 * G * G / pow(omega, 5.0) * exp(-1.25 * pow(wp / omega, 4.0)) * pow(3.3, peak);
    }
    void component(float i, out vec2 dir, out float k, out float omega, out float amp, out float phase) {
      float t = i / 47.0;
      float wind = max(uWind, 1.5);
      float wp = 0.13 * G / wind * 6.28318530718;
      float wMin = wp * .38;
      float wMax = wp * 7.8;
      omega = wMin * pow(wMax / wMin, t);
      k = omega * omega / G;
      float spectrum = jonswap(omega, wp);
      float spread = mix(1.18, .18, smoothstep(0.0, 1.0, t));
      float theta = -PI * .5 + (t - .5) * PI * spread + .25 + (hash(i * 8.31) - .5) * .46;
      dir = normalize(vec2(cos(theta), sin(theta)));
      float longSet = mix(1.18, .74, smoothstep(.42, 1.0, t));
      amp = clamp(sqrt(2.0 * spectrum * ((wMax - wMin) / 48.0)) * 1.08 * wind / 12.0 * longSet, 0.0, 2.85);
      phase = hash(i * 19.19 + 3.7) * 6.28318530718;
    }
    void main() {
      vUv = uv;
      vec3 p = position;
      vec2 wp = p.xz * .15;
      float h = 0.0;
      vec2 lateral = vec2(0.0);
      vec2 grad = vec2(0.0);
      float crest = 0.0;
      for (int j = 0; j < 48; j++) {
        float i = float(j);
        vec2 dir; float k; float omega; float amp; float phase;
        component(i, dir, k, omega, amp, phase);
        float a = dot(dir, wp) * k - omega * uTime + phase;
        h += amp * sin(a);
        float ca = cos(a);
        lateral += dir * ca * amp * (.22 + .16 * uChop);
        grad += dir * (amp * k * ca);
        crest += abs(amp * k * ca);
      }
      float shoreFade = smoothstep(10.0, -34.0, p.z);
      float backSwell = sin(p.x * .035 - uTime * .20) * .28 + sin(p.z * .05 + p.x * .018 + uTime * .12) * .18;
      h += backSwell * shoreFade;
      p.xz += lateral * shoreFade;
      p.y += h * (.44 + shoreFade * 1.12);
      vHeight = h;
      vShore = shoreFade;
      vSlope = clamp(length(grad) * .55, 0.0, 1.0);
      vCrest = clamp(crest * .28 + max(h, 0.0) * .12 + vSlope * .22, 0.0, 1.0);
      vec4 world = modelMatrix * vec4(p, 1.0);
      vWorld = world.xyz;
      vNormal = normalize(normalMatrix * vec3(-grad.x * shoreFade, 1.0, -grad.y * shoreFade));
      gl_Position = projectionMatrix * viewMatrix * world;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform float uTime;
    uniform vec3 uSky;
    uniform vec3 uHorizon;
    uniform vec3 uDeep;
    uniform vec3 uMid;
    uniform vec3 uShallow;
    uniform vec3 uFogTint;
    uniform float uFoamPower;
    uniform float uGold;
    uniform vec3 uSun;
    varying vec3 vWorld;
    varying vec2 vUv;
    varying float vCrest;
    varying float vHeight;
    varying float vShore;
    varying vec3 vNormal;
    varying float vSlope;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0,0.0)), u.x), mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 5; i++) { v += noise(p) * a; p = mat2(1.7,-1.1,1.1,1.7) * p; a *= 0.5; }
      return v;
    }
    vec3 tonemap(vec3 x) {
      x = max(x, vec3(0.0));
      x = (x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14);
      return pow(clamp(x, 0.0, 1.0), vec3(1.0 / 2.2));
    }
    void main() {
      vec3 n = normalize(vNormal);
      vec2 windUv = vWorld.xz;
      vec2 swellUv = vec2(windUv.x * .055 - uTime * .018, windUv.y * .24 + uTime * .045);
      vec2 chopUv = vec2(windUv.x * .42 + windUv.y * .08 - uTime * .12, windUv.y * .95 + uTime * .18);
      vec2 rippleUv = windUv * vec2(3.2, 1.35) + vec2(uTime * .35, -uTime * .12);
      vec2 micro = vec2(fbm(chopUv), fbm(chopUv.yx + 8.0)) - .5;
      vec2 ripple = vec2(fbm(rippleUv), fbm(rippleUv.yx + 3.7)) - .5;
      vec2 capillary = vec2(
        sin(windUv.x * 21.0 - uTime * 2.7) + sin(dot(windUv, vec2(.7, 1.4)) * 17.0 - uTime * 2.1),
        cos(windUv.y * 19.0 - uTime * 2.2) + sin(dot(windUv, vec2(1.3, -.5)) * 23.0 + uTime * 2.4)
      ) * .006;
      vec2 standing = vec2(
        sin(windUv.x * .28 + windUv.y * .11 - uTime * .18),
        cos(windUv.y * .33 - windUv.x * .07 + uTime * .14)
      ) * .055;
      vec3 geometricNormal = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
      n = normalize(n + vec3(micro.x, 0.0, micro.y) * .20 + vec3(ripple.x, 0.0, ripple.y) * .07 + vec3(capillary.x, 0.0, capillary.y) + vec3(standing.x, 0.0, standing.y));
      n = normalize(mix(n, geometricNormal, .28));
      vec3 v = normalize(cameraPosition - vWorld);
      vec3 r = reflect(-v, n);
      float facing = clamp(dot(n, v), 0.0, 1.0);
      float fresnel = .0204 + .9796 * pow(1.0 - facing, 5.0);
      float depth = smoothstep(5.0, -120.0, vWorld.z);
      float opticalDepth = 1.0 - exp(-depth * 3.1);
      vec3 body = mix(uShallow * .66, uDeep * 1.58, opticalDepth);
      body = mix(body, uMid * .82, smoothstep(.10, .72, 1.0 - abs(depth - .45)));
      float volumeBand = smoothstep(.10, .78, fbm(vec2(windUv.x * .032 + uTime * .008, windUv.y * .20 - uTime * .025)));
      body += vec3(.015, .18, .18) * volumeBand * (1.0 - opticalDepth) * (0.45 + vShore * .65);
      float backScatter = pow(max(dot(n, -normalize(uSun)), 0.0), 1.45) * (1.0 - opticalDepth) * (0.85 + vShore * .55);
      float forwardScatter = pow(max(dot(normalize(uSun), v), 0.0), 4.2) * (1.0 - depth);
      body += vec3(.040, .43, .35) * backScatter * .72;
      body += vec3(.12, .52, .46) * forwardScatter * .28;
      body += vec3(.020, .090, .075) * smoothstep(-.22, .62, vHeight) * (1.0 - depth);

      float horizonBand = smoothstep(-.16, .72, r.y);
      vec3 zenithReflection = mix(vec3(.08,.23,.31), uSky * .44, horizonBand);
      float sunMirror = pow(max(dot(r, normalize(uSun)), 0.0), 76.0);
      float sunBloom = pow(max(dot(r, normalize(uSun)), 0.0), 9.0);
      vec3 reflectedSky = mix(zenithReflection, uHorizon * .62, sunBloom * .24);
      reflectedSky += vec3(1.0, .83, .46) * sunMirror * 1.55 * uGold;
      float reflectionWeight = clamp(fresnel * .72 + (1.0 - facing) * .20 + vSlope * .11, 0.0, .72);
      vec3 col = mix(body, reflectedSky, reflectionWeight);

      float specTight = pow(max(dot(reflect(-normalize(uSun), n), v), 0.0), 220.0) * 1.25 * uGold;
      float specWide = pow(max(dot(reflect(-normalize(uSun), n), v), 0.0), 36.0) * .34 * uGold;
      float longRipple = smoothstep(.48, .78, fbm(swellUv + vec2(0.0, uTime * .02)));
      float glitterMask = smoothstep(.66, .96, fbm(windUv * vec2(5.8, 1.65) + vec2(uTime * .34, -uTime * .13)));
      float glitter = glitterMask * pow(max(dot(reflect(-normalize(uSun), n), v), 0.0), 18.0) * .28;

function makeShoreShelf() {
  const segments = 72;
  const vertices = [];
  const indices = [];
  for (let i = 0; i <= segments; i++) {
    const p = i / segments;
    const x = -17.5 + p * 35;
    const scallop = Math.sin(p * Math.PI * 5.0) * 0.32 + Math.sin(p * Math.PI * 11.0) * 0.11;
    vertices.push(x, -0.515, 5.95 + scallop * 0.58);
    vertices.push(x, -0.505, 8.65 + Math.sin(p * Math.PI * 4.0 + 0.8) * 0.12);
    if (i < segments) {
      const a = i * 2;
      indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uLight: { value: palette[timeKey].light },
      uDry: { value: new THREE.Color(0xe4c987) },
      uWet: { value: new THREE.Color(0xaeb69a) },
    },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vPos;
      void main() {
        vUv = uv;
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      precision highp float;
      uniform float uTime;
      uniform float uLight;
      uniform vec3 uDry;
      uniform vec3 uWet;
      varying vec2 vUv;
      varying vec3 vPos;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0,0.0)), u.x), mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
      }
      void main() {
        float wet = smoothstep(0.0, 0.56, 1.0 - vUv.y);
        float grain = noise(vPos.xz * 6.5) * 0.075 + noise(vPos.xz * 24.0) * 0.032;
        float ripple = sin(vPos.x * 2.8 + uTime * 0.18) * 0.015;
        vec3 color = mix(uDry, uWet, wet * 0.46);
        color *= 0.92 + grain * 0.62 + ripple + uLight * 0.06;
        gl_FragColor = vec4(color, 0.58);
      }
    `,
    transparent: true,
    depthWrite: false,
  });
  const shelf = new THREE.Mesh(geometry, mat);
  shelf.receiveShadow = true;
  scene.add(shelf);
  shoreAccents.push(shelf);
  return shelf;
}

function setTime(key) {
  timeKey = key;
  const p = palette[key];
  if (oceanFrame) {
    const weather = key === 'sunset' ? 'breeze' : key === 'night' ? 'calm' : 'breeze';
    oceanFrame.src = `/game-v3/ocean-pass/?time=${encodeURIComponent(key)}&weather=${weather}`;
  }
  scene.fog.color.setHex(p.fog);
  skyMat.uniforms.topColor.value.setHex(p.sky);
  skyMat.uniforms.horizonColor.value.setHex(p.horizon);
  skyMat.uniforms.sunColor.value.setHex(p.sun);
  waterUniforms.uWind.value = p.wind;
  waterUniforms.uChop.value = p.chop;
  waterUniforms.uFoamPower.value = p.foam;
  waterUniforms.uGold.value = p.gold;
  waterUniforms.uSky.value.setHex(p.sky);
  waterUniforms.uHorizon.value.setHex(p.horizon);
  waterUniforms.uDeep.value.set(...p.deep);
  waterUniforms.uMid.value.set(...p.mid);
  waterUniforms.uShallow.value.set(...p.shallow);
  waterUniforms.uFogTint.value.setHex(p.fog);
  sandMat.uniforms.uLight.value = p.light;
  sunSprite.material.opacity = key === 'night' ? 0.28 : 0.92;
  const rayOpacity = key === 'night' ? 0.015 : key === 'sunset' ? 0.16 : 0.10;
  for (const ray of atmosphereRays) ray.material.opacity = rayOpacity;
  for (const button of document.querySelectorAll('[data-time]')) button.classList.toggle('active', button.dataset.time === key);
}
document.querySelectorAll('[data-time]').forEach(button => button.addEventListener('click', () => setTime(button.dataset.time)));

  pointerY = event.clientY / innerHeight - 0.5;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  const elapsed = clock.getElapsedTime();
  waterUniforms.uTime.value = elapsed;
  foamMat.uniforms.uTime.value = elapsed;
  sandMat.uniforms.uTime.value = elapsed;
  for (const accent of shoreAccents) {
    if (accent.material?.uniforms?.uTime) accent.material.uniforms.uTime.value = elapsed;
    if (accent.material?.uniforms?.uLight) accent.material.uniforms.uLight.value = palette[timeKey].light;
    if (accent.material && accent.material.transparent) {
      const base = accent.userData.baseOpacity ?? accent.material.opacity;
      accent.material.opacity = Math.max(0.08, base + Math.sin(elapsed * 0.7 + accent.userData.phase) * 0.025);
    }
    if (accent.userData.baseY !== undefined) {
      accent.position.y = accent.userData.baseY + Math.sin(elapsed * 0.45 + accent.userData.phase) * 0.004;
    }
    if (accent.isGroup) {
      accent.rotation.z = Math.sin(elapsed * 0.9 + accent.position.x) * 0.018;
    }
  }
  for (const line of waveLines) {
    const position = line.geometry.attributes.position;
    const { seed, z, width } = line.userData;
    for (let i = 0; i < position.count; i++) {
      const p = i / Math.max(1, position.count - 1);
      position.setX(i, (p - 0.5) * width + Math.sin(elapsed * 0.25 + p * 6.0 + seed) * 0.08);
      position.setY(i, -0.16 + Math.sin(p * Math.PI * 4 + seed + elapsed * 0.7) * 0.03);
      position.setZ(i, z + Math.sin(p * Math.PI * 2 + seed + elapsed * 0.32) * 0.25);
    }
    position.needsUpdate = true;
  }
  dog.position.x = -4.2 + Math.sin(elapsed * 0.55) * 0.42;
  dog.rotation.y = Math.sin(elapsed * 0.55) * 0.12;
  labSprite.position.x = -2.8 + Math.sin(elapsed * 0.55) * 0.38;
  labSprite.material.rotation = Math.sin(elapsed * 1.1) * 0.015;
  labShadow.position.x = labSprite.position.x;
  alhenaSprite.position.y = 1.55 + Math.sin(elapsed * 1.2) * 0.025;
  houseSprite.material.rotation = Math.sin(elapsed * 0.22) * 0.004;
  houseShadow.material.opacity = 0.18 + Math.sin(elapsed * 0.18) * 0.015;
  barShadow.material.opacity = 0.20 + Math.sin(elapsed * 0.21) * 0.014;
  person.rotation.y = Math.sin(elapsed * 0.38) * 0.08;
  bobber.position.y = -0.05 + Math.sin(elapsed * 2.2) * 0.10;
  camera.position.x += (pointerX * 2.2 - camera.position.x) * 0.018;
  camera.position.y += (5.1 - pointerY * 0.8 - camera.position.y) * 0.018;
  camera.lookAt(0, 0.85, -24);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
