<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07131b">
<title>Paradise V3 - Shader Ocean Composite</title>
<style>
:root {
  --paper: #f7edce;
  --glass: rgba(5, 15, 26, 0.58);
  --line: rgba(247, 237, 206, 0.18);
  --gold: #f0cf7a;
  --cyan: #78d8ed;
  --grade-opacity: 1;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07131b; color: var(--paper); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
canvas { display: block; }
.ocean-pass-frame {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100vw;
  height: 100vh;
  border: 0;
  pointer-events: none;
  background: #07131b;
}
body > canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
}
.shoreline-atmosphere {
  position: fixed;
  inset: auto 0 0;
  z-index: 2;
  height: 34vh;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 22% 58%, rgba(255, 238, 171, 0.13), transparent 24%),
    radial-gradient(ellipse at 74% 52%, rgba(255, 224, 159, 0.10), transparent 20%),
    linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(232, 250, 255, 0.07) 16%, rgba(245, 233, 188, 0.22) 40%, rgba(167, 112, 56, 0.22) 100%);
  mix-blend-mode: soft-light;
}
.shoreline-atmosphere::before,
.shoreline-atmosphere::after {
  content: "";
  position: absolute;
  left: -10vw;
  right: -10vw;
  height: 28px;
  border-radius: 50%;
  filter: blur(8px);
  transform: rotate(-1.2deg);
}
.shoreline-atmosphere::before {
  top: 16%;
  background: linear-gradient(90deg, transparent, rgba(238, 254, 255, 0.52), rgba(255, 241, 207, 0.22), transparent);
  opacity: 0.42;
}
.shoreline-atmosphere::after {
  top: 28%;
  background: linear-gradient(90deg, transparent, rgba(255, 248, 226, 0.26), rgba(215, 246, 255, 0.38), transparent);
  opacity: 0.28;
  transform: rotate(0.8deg);
}
.cinematic-grade {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(circle at 40% 32%, rgba(255,244,206,0.13), transparent 20%),
    radial-gradient(circle at 72% 58%, rgba(62,197,216,0.10), transparent 26%),
    radial-gradient(ellipse at 50% 50%, transparent 0 54%, rgba(3,10,18,0.18) 82%, rgba(3,10,18,0.34) 100%),
    linear-gradient(180deg, rgba(255,255,255,0.025), transparent 28%, rgba(0,32,42,0.10) 100%);
  mix-blend-mode: soft-light;
  opacity: var(--grade-opacity);
  transition: opacity 380ms ease;
}
.cinematic-grade::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .11;
  background-image:
    linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px),
    linear-gradient(0deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 5px 5px, 7px 7px;
  mask-image: radial-gradient(ellipse at center, transparent 0 28%, black 82%);
}
.depth-grade {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 20%),
    linear-gradient(90deg, rgba(255,235,170,0.10), transparent 24%, transparent 72%, rgba(76,196,218,0.08)),
    radial-gradient(ellipse at 50% 71%, rgba(2, 20, 32, 0.0) 0 32%, rgba(2, 20, 32, 0.15) 100%);
  mix-blend-mode: screen;
  opacity: 0.48;
}
body.clean .hud,
body.clean .readout {
  opacity: 0;
  pointer-events: none;
}
.hud {
  position: fixed;
  left: max(16px, env(safe-area-inset-left));
  top: max(16px, env(safe-area-inset-top));
  z-index: 3;
  width: min(324px, calc(100vw - 32px));
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--glass);
  box-shadow: 0 18px 56px rgba(0,0,0,0.26), inset 0 1px rgba(255,255,255,0.08);
  backdrop-filter: blur(14px) saturate(1.15);
}
.kicker {
  color: var(--gold);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .18em;
  text-transform: uppercase;
}
h1 {
  margin: 7px 0 3px;
  font: 500 clamp(22px, 3vw, 34px)/.9 Georgia, "Times New Roman", serif;
  letter-spacing: -.04em;
}
.hud p { display: none; }
p { margin: 0; color: rgba(247,237,206,.68); line-height: 1.42; font-size: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
button, a.button {
  min-height: 31px;
  padding: 8px 10px;
  border: 1px solid rgba(247,237,206,.24);
  border-radius: 999px;
  background: rgba(255,255,255,.07);
  color: var(--paper);
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: .13em;
  font-size: 9px;
  font-weight: 800;
  cursor: pointer;
}
button.active { color: #07131b; background: linear-gradient(135deg, #fff2b6, #d5a844); border-color: transparent; }
.play-row button {
  min-width: 104px;
  border-color: rgba(120,216,237,.32);
  background: rgba(7, 33, 48, .28);
}
.play-row #cast-reel {
  min-width: 132px;
  color: #06101a;
  background: linear-gradient(135deg, #dffcff, #f0cf7a);
  border-color: transparent;
}
.play-row button.alert {
  animation: bitePulse 720ms ease-in-out infinite alternate;
}
.catch-log {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  margin-top: 8px;
}
.catch-slot {
  min-height: 22px;
  padding: 5px 6px;
  border: 1px solid rgba(120,216,237,.20);
  border-radius: 10px;
  background: rgba(7, 33, 48, .22);
  color: rgba(247,237,206,.70);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.catch-slot.filled {
  color: #07131b;
  background: linear-gradient(135deg, rgba(223,252,255,.92), rgba(240,207,122,.84));
  border-color: transparent;
}
@keyframes bitePulse {
  from { filter: drop-shadow(0 0 0 rgba(240,207,122,0)); transform: translateY(0); }
  to { filter: drop-shadow(0 0 16px rgba(240,207,122,.75)); transform: translateY(-1px); }
}
.readout {
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(16px, env(safe-area-inset-bottom));
  z-index: 3;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(5,15,26,.48);
  color: rgba(247,237,206,.68);
  backdrop-filter: blur(14px);
  text-transform: uppercase;
  letter-spacing: .14em;
  font-size: 10px;
}
@media (max-width: 760px) {
  .hud { padding: 14px; }
  .hud p { display: none; }
  .row { margin-top: 10px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .hud {
    left: max(10px, env(safe-area-inset-left));
    top: auto;
    bottom: max(10px, env(safe-area-inset-bottom));
    width: min(680px, calc(100vw - 20px));
    padding: 10px;
    border-radius: 18px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .kicker {
    font-size: 8px;
    letter-spacing: .16em;
  }
  h1,
  .hud p {
    display: none;
  }
  .row {
    margin-top: 0;
    gap: 6px;
  }
  button,
  a.button {
    min-height: 34px;
    padding: 8px 10px;
    font-size: 9px;
    letter-spacing: .11em;
  }
  .play-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr .8fr;
  }
  .catch-log {
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 4px;
    margin-top: 0;
  }
  .catch-slot {
    min-height: 22px;
    padding: 5px 6px;
    font-size: 7px;
    letter-spacing: .06em;
  }
  .play-row button,
  .play-row #cast-reel {
    min-width: 0;
    width: 100%;
  }
  .readout {
    right: max(10px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    font-size: 8px;
    padding: 8px 10px;
    max-width: 32vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
}
</style>

{
  "imports": {

<body data-paradise-v3="shader-ocean-composite" data-water-system="paradise-pandorachat-webgl2-jonswap-ocean-v7-composite" data-character-system="procedural-3d-rig-v2">
<iframe class="ocean-pass-frame" id="ocean-pass-frame" title="PandoraChat WebGL ocean pass" src="/game-v3/ocean-pass/?time=dawn&amp;weather=breeze"></iframe>
<div class="shoreline-atmosphere" aria-hidden="true"></div>
<div class="cinematic-grade" aria-hidden="true"></div>
<div class="depth-grade" aria-hidden="true"></div>
<aside class="hud">
  <div class="kicker">Paradise V3 / Shader Composite</div>
  <h1>Paradise Fishing.</h1>
  <p>This route composes a standalone PandoraChat-style ocean shader behind the game foreground: JONSWAP-inspired wave spectra, analytical normals, Fresnel, scatter, foam, fog, and tone mapping.</p>
  <div class="row">
    <button class="active" data-time="dawn">Dawn</button>
    <button data-time="noon">Noon</button>
    <button data-time="sunset">Sunset</button>
    <button data-time="night">Night</button>
    <button data-weather="calm">Calm</button>
    <button class="active" data-weather="breeze">Breeze</button>
    <button data-weather="storm">Storm</button>
    <a class="button" href="/">Root Game</a>
    <a class="button" href="/game-v3/">V3 Gate</a>
  </div>
  <div class="row play-row">
    <button id="cast-reel">Cast Line</button>
    <button id="view-cycle">View: Wide</button>
    <button id="reset-cast">Reset</button>
  </div>
  <div class="catch-log" id="catch-log" aria-label="catch log"></div>
</aside>
<div class="readout" id="readout">loading mesh ocean</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const readout = document.getElementById('readout');
const castButton = document.getElementById('cast-reel');
const viewButton = document.getElementById('view-cycle');
const resetButton = document.getElementById('reset-cast');
const catchLog = document.getElementById('catch-log');
const palette = {
  dawn: { sky: 0x8fcde0, horizon: 0xffd89a, sun: 0xffefb4, deep: [0.00, 0.04, 0.10], mid: [0.00, 0.19, 0.28], shallow: [0.05, 0.42, 0.44], fog: 0xaad0d4, light: 1.15, gold: 1.0, wind: 8.4, chop: 0.92, foam: 0.72, exposure: 1.03, hemi: 1.22, sunPower: 2.55, fogDensity: 0.018, grade: 0.92 },
  noon: { sky: 0x55aeea, horizon: 0xd7eff7, sun: 0xfff5cf, deep: [0.00, 0.05, 0.16], mid: [0.00, 0.23, 0.38], shallow: [0.06, 0.54, 0.56], fog: 0xbfe4ea, light: 1.35, gold: 0.62, wind: 7.6, chop: 0.86, foam: 0.58, exposure: 1.10, hemi: 1.42, sunPower: 2.95, fogDensity: 0.013, grade: 0.74 },
  sunset: { sky: 0x3f315c, horizon: 0xffb469, sun: 0xffa45a, deep: [0.00, 0.018, 0.064], mid: [0.03, 0.09, 0.16], shallow: [0.18, 0.22, 0.27], fog: 0xa87572, light: 0.95, gold: 1.18, wind: 10.8, chop: 1.08, foam: 0.92, exposure: 0.96, hemi: 0.86, sunPower: 2.25, fogDensity: 0.022, grade: 1.10 },
  night: { sky: 0x030815, horizon: 0x243c5a, sun: 0xbfdfff, deep: [0.00, 0.006, 0.028], mid: [0.00, 0.04, 0.09], shallow: [0.02, 0.15, 0.20], fog: 0x102035, light: 0.52, gold: 0.18, wind: 6.2, chop: 0.72, foam: 0.45, exposure: 0.72, hemi: 0.44, sunPower: 0.92, fogDensity: 0.028, grade: 1.24 },
};
const weatherProfiles = {
  calm: { light: 1.05, fog: 0.88, reflection: 0.85, grade: 0.90 },
  breeze: { light: 1.00, fog: 1.00, reflection: 1.00, grade: 1.00 },
  storm: { light: 0.72, fog: 1.45, reflection: 0.64, grade: 1.24 },
};
let timeKey = new URLSearchParams(location.search).get('time') || 'dawn';
if (!palette[timeKey]) timeKey = 'dawn';
let weatherKey = new URLSearchParams(location.search).get('weather') || 'breeze';
if (!['calm', 'breeze', 'storm'].includes(weatherKey)) weatherKey = 'breeze';
const cleanPresentation = new URLSearchParams(location.search).get('clean') === '1';
document.body.classList.toggle('clean', cleanPresentation);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(palette[timeKey].fog, 0.018);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 900);
camera.position.set(0, 3.85, 19.5);
camera.lookAt(0, 0.45, -34);

const oceanFrame = document.getElementById('ocean-pass-frame');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
renderer.setClearColor(0x000000, 0);

const hemi = new THREE.HemisphereLight(0xf7f1d6, 0x102033, 1.3);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe0a4, 2.4);
sun.position.set(-9, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.00045;
sun.shadow.normalBias = 0.026;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -28;
sun.shadow.camera.right = 28;
sun.shadow.camera.top = 24;
sun.shadow.camera.bottom = -24;
scene.add(sun);

const skyGeo = new THREE.SphereGeometry(360, 48, 24);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    topColor: { value: new THREE.Color(palette[timeKey].sky) },
    horizonColor: { value: new THREE.Color(palette[timeKey].horizon) },
    sunColor: { value: new THREE.Color(palette[timeKey].sun) },
    sunDir: { value: new THREE.Vector3(-0.42, 0.62, 0.2).normalize() },
  },
  vertexShader: `
    varying vec3 vWorld;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = normalize(wp.xyz);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vWorld;
    uniform vec3 topColor;
    uniform vec3 horizonColor;
    uniform vec3 sunColor;
    uniform vec3 sunDir;
    void main() {
      float h = clamp(vWorld.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 c = mix(horizonColor, topColor, smoothstep(0.05, 0.82, h));
      float s = pow(max(dot(vWorld, sunDir), 0.0), 360.0);
      float glow = pow(max(dot(vWorld, sunDir), 0.0), 16.0);
      c += sunColor * (s * 2.8 + glow * 0.26);
      gl_FragColor = vec4(c, 1.0);
    }
  `
});
const skyDome = new THREE.Mesh(skyGeo, skyMat);
skyDome.visible = false;
scene.add(skyDome);

function makeGlowTexture(color = 'rgba(255,255,255,1)') {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, color);
  g.addColorStop(0.38, color.replace(/,1\)$/, ',0.42)'));
  g.addColorStop(1, color.replace(/,1\)$/, ',0)'));
  x.fillStyle = g;
  x.fillRect(0, 0, 256, 256);
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function makeRayTexture() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 64;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 512, 0);
  g.addColorStop(0, 'rgba(255,248,210,0)');
  g.addColorStop(0.20, 'rgba(255,248,210,0.16)');
  g.addColorStop(0.52, 'rgba(255,248,210,0.32)');
  g.addColorStop(1, 'rgba(255,248,210,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 512, 64);
  const v = x.createLinearGradient(0, 0, 0, 64);
  v.addColorStop(0, 'rgba(255,255,255,0)');
  v.addColorStop(0.5, 'rgba(255,255,255,1)');
  v.addColorStop(1, 'rgba(255,255,255,0)');
  x.globalCompositeOperation = 'destination-in';
  x.fillStyle = v;
  x.fillRect(0, 0, 512, 64);
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture('rgba(255,233,166,1)'),
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
}));
sunSprite.position.set(-22, 18, -120);
sunSprite.scale.set(16, 16, 1);
scene.add(sunSprite);

const rayMat = new THREE.MeshBasicMaterial({
  map: makeRayTexture(),
  color: 0xffdf93,
  transparent: true,
  opacity: 0.18,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
});
const atmosphereRays = [];
for (let i = 0; i < 5; i++) {
  const ray = new THREE.Mesh(new THREE.PlaneGeometry(32 + i * 9, 2.4 + i * 0.8), rayMat.clone());
  ray.position.set(-13 + i * 6, 7.2 - i * 0.34, -38 + i * 3);
  ray.rotation.set(-0.18, 0.1, -0.22 + i * 0.035);
  ray.userData.rayPhase = i;
  scene.add(ray);
  atmosphereRays.push(ray);
}

function makeSparkTexture() {
  const c = document.createElement('canvas');
  c.width = 96;
  c.height = 96;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(48, 48, 0, 48, 48, 48);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.22, 'rgba(225,252,255,.72)');
  g.addColorStop(0.58, 'rgba(240,207,122,.22)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 96, 96);
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function makeParticleField(count, bounds, color, size, opacity) {
  const positions = new Float32Array(count * 3);
  const seeds = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const j = i * 3;
    positions[j] = bounds.x[0] + Math.random() * (bounds.x[1] - bounds.x[0]);
    positions[j + 1] = bounds.y[0] + Math.random() * (bounds.y[1] - bounds.y[0]);
    positions[j + 2] = bounds.z[0] + Math.random() * (bounds.z[1] - bounds.z[0]);
    seeds[i] = Math.random() * Math.PI * 2;
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({
    map: makeSparkTexture(),
    color,
    size,
    transparent: true,
    opacity,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
  });
  const points = new THREE.Points(geometry, material);
  points.userData = { seeds, base: positions.slice(0), bounds };
  scene.add(points);
  return points;
}

const seaGlints = makeParticleField(120, { x: [-17, 17], y: [-0.18, 0.10], z: [-34, -5] }, 0xdffcff, 0.13, 0.22);
const shoreMotes = makeParticleField(80, { x: [-14, 14], y: [0.05, 1.20], z: [4.4, 9.4] }, 0xfff0bd, 0.10, 0.16);

const waterUniforms = {
  uTime: { value: 0 },
  uWind: { value: palette[timeKey].wind },
  uChop: { value: palette[timeKey].chop },
  uFoamPower: { value: palette[timeKey].foam },
  uGold: { value: palette[timeKey].gold },
  uSky: { value: new THREE.Color(palette[timeKey].sky) },
  uHorizon: { value: new THREE.Color(palette[timeKey].horizon) },
  uDeep: { value: new THREE.Vector3(...palette[timeKey].deep) },
  uMid: { value: new THREE.Vector3(...palette[timeKey].mid) },
  uShallow: { value: new THREE.Vector3(...palette[timeKey].shallow) },
  uFogTint: { value: new THREE.Color(palette[timeKey].fog) },
  uSun: { value: new THREE.Vector3(-0.42, 0.62, 0.2).normalize() },
};
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  extensions: { derivatives: true },
  transparent: false,
  vertexShader: `
    uniform float uTime;
    uniform float uWind;
    uniform float uChop;
    varying vec3 vWorld;
    varying vec2 vUv;
    varying float vCrest;
    varying float vHeight;
    varying float vShore;
    varying vec3 vNormal;
    varying float vSlope;
    const float PI = 3.14159265359;
    const float G = 9.81;
    float hash(float n) { return fract(sin(n) * 43758.5453123); }
    float jonswap(float omega, float wp) {

function makeSandTexture() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#c9a768';
  x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 1800; i++) {
    const a = 0.04 + Math.random() * 0.13;
    x.fillStyle = i % 4 ? `rgba(72,48,28,${a})` : `rgba(255,244,198,${a})`;
    x.beginPath();
    x.ellipse(Math.random() * 512, Math.random() * 512, 0.8 + Math.random() * 2.2, 0.35 + Math.random(), Math.random() * Math.PI, 0, Math.PI * 2);
    x.fill();
  }
  const texture = new THREE.CanvasTexture(c);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(8, 3);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function makeMaterialTexture({ base = '#ffffff', fleck = '#000000', line = null, count = 900, width = 256, height = 256, repeat = [1, 1] } = {}) {
  const c = document.createElement('canvas');
  c.width = width;
  c.height = height;
  const x = c.getContext('2d');
  x.fillStyle = base;
  x.fillRect(0, 0, width, height);
  for (let i = 0; i < count; i++) {
    const alpha = 0.025 + Math.random() * 0.12;
    x.fillStyle = fleck.replace('ALPHA', alpha.toFixed(3));
    x.beginPath();
    x.ellipse(Math.random() * width, Math.random() * height, 0.4 + Math.random() * 2.8, 0.25 + Math.random() * 1.4, Math.random() * Math.PI, 0, Math.PI * 2);
    x.fill();
  }
  if (line) {
    x.globalAlpha = line.alpha ?? 0.18;
    x.strokeStyle = line.color;
    x.lineWidth = line.width ?? 2;
    for (let y = -height; y < height * 2; y += line.gap ?? 22) {
      x.beginPath();
      x.moveTo(-20, y + Math.random() * 8);
      x.bezierCurveTo(width * 0.32, y + 8, width * 0.64, y - 8, width + 20, y + Math.random() * 8);
      x.stroke();
    }
    x.globalAlpha = 1;
  }
  const texture = new THREE.CanvasTexture(c);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeat[0], repeat[1]);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 8;
  return texture;
}

function makeCausticSheet() {
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vWorld;
      void main() {
        vUv = uv;
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `,
    fragmentShader: `
      precision highp float;
      uniform float uTime;
      varying vec2 vUv;
      varying vec3 vWorld;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0,0.0)), u.x), mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
      }
      void main() {
        vec2 p = vWorld.xz;
        float n1 = noise(p * vec2(1.9, 3.4) + vec2(uTime * .16, -uTime * .11));
        float n2 = noise(p * vec2(4.8, 2.6) + vec2(-uTime * .09, uTime * .14));
        float lace = pow(abs(n1 - n2), 1.8);
        float shore = smoothstep(0.0, 0.28, vUv.y) * smoothstep(1.0, 0.56, vUv.y);
        float mask = smoothstep(0.20, 0.72, lace) * shore;
        gl_FragColor = vec4(0.70, 0.98, 1.0, mask * 0.072);
      }
    `,
  });
  const sheet = new THREE.Mesh(new THREE.PlaneGeometry(58, 14, 1, 1), mat);
  sheet.rotation.x = -Math.PI / 2;
  sheet.position.set(0, -0.385, 8.0);
  scene.add(sheet);
  return sheet;
}

function makeShoreShelf() {
  const segments = 72;
  const vertices = [];
  const indices = [];
  for (let i = 0; i <= segments; i++) {
    const p = i / segments;
    const x = -17.5 + p * 35;
    const scallop = Math.sin(p * Math.PI * 5.0) * 0.32 + Math.sin(p * Math.PI * 11.0) * 0.11;
    vertices.push(x, -0.515, 5.95 + scallop * 0.58);
    vertices.push(x, -0.505, 8.65 + Math.sin(p * Math.PI * 4.0 + 0.8) * 0.12);
    if (i < segments) {
      const a = i * 2;
      indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uLight: { value: palette[timeKey].light },
      uDry: { value: new THREE.Color(0xe4c987) },
      uWet: { value: new THREE.Color(0xaeb69a) },
    },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vPos;
      void main() {
        vUv = uv;
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      precision highp float;
      uniform float uTime;
      uniform float uLight;
      uniform vec3 uDry;
      uniform vec3 uWet;
      varying vec2 vUv;
      varying vec3 vPos;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0,0.0)), u.x), mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
      }
      void main() {
        float wet = smoothstep(0.0, 0.56, 1.0 - vUv.y);
        float grain = noise(vPos.xz * 6.5) * 0.075 + noise(vPos.xz * 24.0) * 0.032;
        float ripple = sin(vPos.x * 2.8 + uTime * 0.18) * 0.015;
        vec3 color = mix(uDry, uWet, wet * 0.46);
        color *= 0.92 + grain * 0.62 + ripple + uLight * 0.06;
        gl_FragColor = vec4(color, 0.58);
      }
    `,
    transparent: true,
    depthWrite: false,
  });
  const shelf = new THREE.Mesh(geometry, mat);
  shelf.receiveShadow = true;
  scene.add(shelf);
  shoreAccents.push(shelf);
  return shelf;
}

  material.color.offsetHSL(0, -0.08, wet ? -0.05 : 0.04);
  material.transparent = true;
  material.opacity = wet ? 0.22 : 0.18;
  const mesh = new THREE.Mesh(geometry, material);
  mesh.rotation.x = -Math.PI / 2;
  mesh.rotation.z = rotation;
  mesh.position.set(x, wet ? -0.445 : -0.49, z);
  mesh.scale.set(sx, sz, 1);
  mesh.receiveShadow = true;
  mesh.userData.baseY = mesh.position.y;
  mesh.userData.phase = x * 0.7 + z * 0.31;
  mesh.userData.baseOpacity = material.opacity;
  scene.add(mesh);
  shoreAccents.push(mesh);
  return mesh;
}

function makeGrassCluster(x, z, scale = 1, spread = 0.48) {

function easeInOut(t) {

function vibrate(pattern) {
  if (!navigator.vibrate || navigator.userActivation?.isActive === false) return;
  navigator.vibrate(pattern);
}
function setGradeOpacity(value) {
  document.documentElement.style.setProperty('--grade-opacity', Math.min(1, Math.max(0.35, value)).toFixed(2));
}
function refreshPlayHud() {
  castButton.textContent = playState.bite ? 'Reel Bite' : playState.cast ? 'Reel' : 'Cast Line';
  castButton.classList.toggle('alert', playState.bite);
  viewButton.textContent = `View: ${viewTargets[playState.view].label}`;
}
function renderCatchLog() {
  catchLog.replaceChildren();
  for (let i = 0; i < 8; i++) {
    const slot = document.createElement('div');
    slot.className = `catch-slot${playState.catches[i] ? ' filled' : ''}`;
    slot.textContent = playState.catches[i]?.name || 'unknown';
    catchLog.appendChild(slot);
  }
}
function recordCatch(forceIndex = null) {
  const speciesIndex = forceIndex ?? Math.floor((performance.now() * 0.013 + playState.catches.length * 2.7) % fishSpecies.length);
  const name = fishSpecies[speciesIndex % fishSpecies.length];
  const catchItem = { name, time: timeKey, weather: weatherKey, at: Date.now() };
  playState.catches.unshift(catchItem);
  playState.catches = playState.catches.slice(0, 8);
  renderCatchLog();
  return catchItem;
}
function resetCast() {
  playState.cast = false;
  playState.castProgress = 0;
  playState.bite = false;
  playState.biteUntil = 0;
  playState.tension = 0;
  readout.textContent = 'line reset / space casts';
  refreshPlayHud();
}
function castLine() {
  playState.cast = true;
  playState.bite = false;
  playState.tension = 0;
  readout.textContent = 'line out / wait for bite';
  vibrate(18);
  refreshPlayHud();
}
function reelLine() {
  if (playState.bite) {
    const catchItem = recordCatch();
    readout.textContent = `landed ${catchItem.name}`;
    vibrate([28, 35, 28]);
  } else {
    readout.textContent = 'reeling line back';
    vibrate(12);
  }
  playState.cast = false;
  playState.bite = false;
  playState.biteUntil = 0;
  playState.tension = 0;
  refreshPlayHud();
}
function toggleCast() {
  if (playState.cast) reelLine();
  else castLine();
}
function cycleView() {
  playState.view = (playState.view + 1) % viewTargets.length;
  readout.textContent = `camera / ${viewTargets[playState.view].label.toLowerCase()}`;
  refreshPlayHud();
}

addEventListener('keydown', event => {
  if (event.repeat) return;
  const tag = event.target?.tagName?.toLowerCase();
  if (tag === 'input' || tag === 'textarea' || event.target?.isContentEditable) return;
  if (event.code === 'Space') {
    event.preventDefault();
    toggleCast();
  } else if (event.key.toLowerCase() === 'c') {
    resetCast();
  } else if (event.key.toLowerCase() === 'v') {
    cycleView();
  }
});

  gltf.scene.visible = false;
  scene.add(gltf.scene);
  readout.textContent = 'mesh ocean + glb validated / hidden';
}, undefined, err => {
  readout.textContent = `mesh ocean / glb missing: ${err.message || 'load failed'}`;
});

function setTime(key) {
  timeKey = key;
  const p = palette[key];
  const w = weatherProfiles[weatherKey];
  updateOceanFrame();
  scene.fog.color.setHex(p.fog);
  scene.fog.density = p.fogDensity * w.fog;
  skyMat.uniforms.topColor.value.setHex(p.sky);
  skyMat.uniforms.horizonColor.value.setHex(p.horizon);
  skyMat.uniforms.sunColor.value.setHex(p.sun);
  renderer.toneMappingExposure = p.exposure * w.light;
  hemi.intensity = p.hemi * w.light;
  sun.intensity = p.sunPower * w.light;
  sun.color.setHex(p.sun);
  waterUniforms.uWind.value = p.wind;
  waterUniforms.uChop.value = p.chop;
  waterUniforms.uFoamPower.value = p.foam;
  waterUniforms.uGold.value = p.gold;
  waterUniforms.uSky.value.setHex(p.sky);
  waterUniforms.uHorizon.value.setHex(p.horizon);
  waterUniforms.uDeep.value.set(...p.deep);
  waterUniforms.uMid.value.set(...p.mid);
  waterUniforms.uShallow.value.set(...p.shallow);
  waterUniforms.uFogTint.value.setHex(p.fog);
  sandMat.uniforms.uLight.value = p.light;
  sunSprite.material.opacity = key === 'night' ? 0.28 : 0.92;
  const rayOpacity = key === 'night' ? 0.015 : key === 'sunset' ? 0.16 : 0.10;
  for (const ray of atmosphereRays) ray.material.opacity = rayOpacity;
  setGradeOpacity(p.grade * w.grade);
  document.body.dataset.time = key;
  for (const button of document.querySelectorAll('[data-time]')) button.classList.toggle('active', button.dataset.time === key);
}
function setWeather(key) {
  weatherKey = key;
  const p = palette[timeKey];
  const w = weatherProfiles[key];
  nearWaterMat.uniforms.uEnergy.value = key === 'storm' ? 1.0 : key === 'breeze' ? 0.72 : 0.42;
  scene.fog.density = p.fogDensity * w.fog;
  renderer.toneMappingExposure = p.exposure * w.light;
  hemi.intensity = p.hemi * w.light;
  sun.intensity = p.sunPower * w.light;
  setGradeOpacity(p.grade * w.grade);
  document.body.dataset.weather = key;
  updateOceanFrame();
  for (const button of document.querySelectorAll('[data-weather]')) button.classList.toggle('active', button.dataset.weather === key);
}
function updateOceanFrame() {
  if (!oceanFrame) return;
  oceanFrame.src = `/game-v3/ocean-pass/?time=${encodeURIComponent(timeKey)}&weather=${encodeURIComponent(weatherKey)}`;
}
document.querySelectorAll('[data-time]').forEach(button => button.addEventListener('click', () => setTime(button.dataset.time)));
document.querySelectorAll('[data-weather]').forEach(button => button.addEventListener('click', () => setWeather(button.dataset.weather)));
setTime(timeKey);
setWeather(weatherKey);

let pointerX = 0;
let pointerY = 0;
addEventListener('pointermove', event => {
  pointerX = event.clientX / innerWidth - 0.5;
  pointerY = event.clientY / innerHeight - 0.5;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  const elapsed = clock.getElapsedTime();
  waterUniforms.uTime.value = elapsed;
  nearWaterMat.uniforms.uTime.value = elapsed;
  foamMat.uniforms.uTime.value = elapsed;
  sandMat.uniforms.uTime.value = elapsed;
  causticSheet.material.uniforms.uTime.value = elapsed;
  house3D.rotation.z = Math.sin(elapsed * 0.18) * 0.0025;
  bar3D.rotation.z = Math.sin(elapsed * 0.21 + 0.8) * 0.002;
  for (const plank of pier3D.userData.planks) {
    plank.rotation.z = Math.sin(elapsed * 0.54 + plank.userData.phase) * 0.0035;
  }
  for (const reed of reedWall.children) {
    reed.rotation.z = reed.userData.baseZ + Math.sin(elapsed * 0.92 + reed.userData.phase) * 0.030;
  }
  for (const field of [seaGlints, shoreMotes]) {
    const attr = field.geometry.attributes.position;
    const base = field.userData.base;
    const seeds = field.userData.seeds;
    for (let i = 0; i < attr.count; i++) {
      const j = i * 3;
      const seed = seeds[i];
      attr.setX(i, base[j] + Math.sin(elapsed * 0.22 + seed) * 0.16);
      attr.setY(i, base[j + 1] + Math.sin(elapsed * 0.90 + seed * 1.7) * 0.035);
      attr.setZ(i, base[j + 2] + Math.cos(elapsed * 0.18 + seed) * 0.24);
    }
    attr.needsUpdate = true;
  }
  seaGlints.material.opacity = (timeKey === 'night' ? 0.10 : 0.20) * weatherProfiles[weatherKey].reflection;
  shoreMotes.material.opacity = timeKey === 'night' ? 0.07 : 0.15;
  for (const accent of shoreAccents) {
    if (accent.material?.uniforms?.uTime) accent.material.uniforms.uTime.value = elapsed;
    if (accent.material?.uniforms?.uLight) accent.material.uniforms.uLight.value = palette[timeKey].light;
    if (accent.material && accent.material.transparent) {
      const base = accent.userData.baseOpacity ?? accent.material.opacity;
      accent.material.opacity = Math.max(0.08, base + Math.sin(elapsed * 0.7 + accent.userData.phase) * 0.025);
    }
    if (accent.userData.baseY !== undefined) {
      accent.position.y = accent.userData.baseY + Math.sin(elapsed * 0.45 + accent.userData.phase) * 0.004;
    }
    if (accent.isGroup) {
      accent.rotation.z = Math.sin(elapsed * 0.9 + accent.position.x) * 0.018;
    }
  }
  for (const line of waveLines) {
    const position = line.geometry.attributes.position;
    const { seed, z, width } = line.userData;
    for (let i = 0; i < position.count; i++) {
      const p = i / Math.max(1, position.count - 1);
      position.setX(i, (p - 0.5) * width + Math.sin(elapsed * 0.25 + p * 6.0 + seed) * 0.08);
      position.setY(i, -0.16 + Math.sin(p * Math.PI * 4 + seed + elapsed * 0.7) * 0.03);
      position.setZ(i, z + Math.sin(p * Math.PI * 2 + seed + elapsed * 0.32) * 0.25);
    }
    position.needsUpdate = true;
  }
  dog.position.x = -3.10 + Math.sin(elapsed * 0.55) * 0.42;
  dog.position.y = 0.42 + Math.sin(elapsed * 1.15) * 0.018;
  dog.rotation.y = Math.sin(elapsed * 0.55) * 0.12;
  dogBody.rotation.y = Math.sin(elapsed * 1.05) * 0.025;
  dogChest.rotation.y = dogBody.rotation.y * 0.72;
  dogHead.rotation.z = Math.sin(elapsed * 0.92 + 1.1) * 0.045;
  dogTongue.scale.y = 1.0 + Math.sin(elapsed * 6.2) * 0.08;
  dogCollar.rotation.z = Math.sin(elapsed * 1.6) * 0.018;
  dogTail.rotation.z = -0.88 + Math.sin(elapsed * 4.6) * 0.22;
  for (let i = 0; i < dogLegs.length; i++) {
    dogLegs[i].rotation.z = Math.sin(elapsed * 2.6 + i * Math.PI) * 0.15;
    dogLegs[i].position.y = -0.52 + Math.max(0, Math.sin(elapsed * 2.6 + i * Math.PI)) * 0.035;
    dogPaws[i].position.y = -0.84 + Math.max(0, Math.sin(elapsed * 2.6 + i * Math.PI)) * 0.020;
  }
  labSprite.position.x = -2.8 + Math.sin(elapsed * 0.55) * 0.38;
  labSprite.material.rotation = Math.sin(elapsed * 1.1) * 0.015;
  if (articulatedLab.ready) {
    const gait = Math.sin(elapsed * 2.1);
    const sniff = Math.sin(elapsed * 0.92 + 1.2);
    articulatedLab.group.position.x = -2.8 + Math.sin(elapsed * 0.55) * 0.38;
    articulatedLab.group.position.y = 0.10 + Math.sin(elapsed * 1.15) * 0.018;
    articulatedLab.group.rotation.z = Math.sin(elapsed * 0.64) * 0.018;
    articulatedLab.parts.body.rotation.z = Math.sin(elapsed * 1.2) * 0.018;
    articulatedLab.parts.head.position.y = 1.14 + sniff * 0.055;
    articulatedLab.parts.head.rotation.z = -0.035 + sniff * 0.045;
    articulatedLab.parts.tail.rotation.z = 0.18 + Math.sin(elapsed * 4.8) * 0.13;
    articulatedLab.parts.rearLegs.rotation.z = gait * 0.045;
    articulatedLab.parts.frontLegs.rotation.z = -gait * 0.052;
    articulatedLab.parts.collar.rotation.z = articulatedLab.parts.head.rotation.z * 0.55;
  }
  labShadow.position.x = articulatedLab.ready ? articulatedLab.group.position.x : labSprite.position.x;
  if (articulatedAlhena.ready) {
    const breath = Math.sin(elapsed * 1.12);
    const serve = Math.sin(elapsed * 0.74 + 0.8);
    articulatedAlhena.group.position.y = 0.12 + breath * 0.014;
    articulatedAlhena.group.rotation.z = Math.sin(elapsed * 0.42) * 0.010;
    articulatedAlhena.parts.torso.rotation.z = breath * 0.010;
    articulatedAlhena.parts.apron.rotation.z = breath * 0.006;
    articulatedAlhena.parts.skirt.rotation.z = -breath * 0.006;
    articulatedAlhena.parts.head.position.y = 1.94 + Math.sin(elapsed * 0.88 + 1.1) * 0.018;
    articulatedAlhena.parts.head.rotation.z = Math.sin(elapsed * 0.62) * 0.024;
    articulatedAlhena.parts.trayArm.position.y = 1.40 + serve * 0.018;
    articulatedAlhena.parts.trayArm.rotation.z = -0.015 + serve * 0.020;
    articulatedAlhena.parts.rightArm.rotation.z = 0.035 - serve * 0.014;
  } else {
    alhenaSprite.position.y = 1.55 + Math.sin(elapsed * 1.2) * 0.025;
  }
  const alhenaBreath = Math.sin(elapsed * 1.08);
  person.rotation.y = Math.sin(elapsed * 0.38) * 0.08;
  person.position.y = 0.34 + alhenaBreath * 0.006;
  torso.rotation.z = alhenaBreath * 0.012;
  head.rotation.z = Math.sin(elapsed * 0.62) * 0.020;
  hair.rotation.z = head.rotation.z * 0.72;
  tray.position.y = 1.52 + Math.sin(elapsed * 0.74 + 0.8) * 0.018;
  alhenaArms[0].rotation.z = 0.78 + Math.sin(elapsed * 0.74 + 0.8) * 0.018;
  alhenaArms[1].rotation.z = -0.58 - Math.sin(elapsed * 0.82 + 0.3) * 0.016;
  houseSprite.material.rotation = Math.sin(elapsed * 0.22) * 0.004;
  houseShadow.material.opacity = 0.18 + Math.sin(elapsed * 0.18) * 0.015;
  barShadow.material.opacity = 0.20 + Math.sin(elapsed * 0.21) * 0.014;
  for (const reflection of waterReflections) {
    const weatherReflection = weatherProfiles[weatherKey].reflection;
    const shimmer = 0.72 + Math.sin(elapsed * 0.72 + reflection.userData.phase) * 0.18;
    reflection.material.opacity = reflection.userData.baseOpacity * shimmer * weatherReflection * (timeKey === 'night' ? 0.55 : 1);
    reflection.position.y = reflection.userData.baseY + Math.sin(elapsed * 0.9 + reflection.userData.phase) * 0.012;
    reflection.scale.x = reflection.userData.baseScaleX + Math.sin(elapsed * 0.45 + reflection.userData.phase) * 0.018;
  }
  for (const fish of fishShoal) {
    const d = fish.userData;
    const lane = Math.sin(elapsed * 0.18 + d.phase);
    let x = d.x + Math.sin(elapsed * d.speed + d.phase) * (2.8 + d.scale * 1.8) + lane * 0.8;
    if (x > 15) x -= 30;
    if (x < -15) x += 30;
    fish.position.x = x;
    fish.position.y = d.y + Math.sin(elapsed * (0.9 + d.speed * 0.25) + d.phase) * 0.055;
    fish.position.z = d.z + Math.cos(elapsed * 0.34 + d.phase) * 0.32;
    fish.material.rotation = Math.sin(elapsed * 1.4 + d.phase) * 0.055;
    fish.material.opacity = (0.10 + d.scale * 0.07) * weatherProfiles[weatherKey].reflection * (timeKey === 'night' ? 0.42 : 1);
    fish.scale.x = Math.sign(Math.cos(elapsed * d.speed * 0.33 + d.phase)) * Math.abs(d.scale * 1.25);
  }
  const progressTarget = playState.cast ? 1 : 0;
  playState.castProgress += (progressTarget - playState.castProgress) * 0.055;
  const easedCast = easeInOut(playState.castProgress);
  bobberTarget.lerpVectors(dockBobber, waterBobber, easedCast);
  bobberTarget.y += Math.sin(elapsed * 2.2) * (0.025 + easedCast * 0.095);
  bobber.position.copy(bobberTarget);
  lineMidA.lerpVectors(rodTip, bobber.position, 0.34);
  lineMidB.lerpVectors(rodTip, bobber.position, 0.68);
  const sag = playState.cast ? 0.55 : 0.18;
  lineMidA.y += 1.05 - sag * easedCast;
  lineMidB.y += 0.62 - sag * 1.15 * easedCast;
  rodLine.geometry.dispose();
  rodLine.geometry = new THREE.BufferGeometry().setFromPoints(new THREE.CatmullRomCurve3([
    rodTip,
    lineMidA.clone(),
    lineMidB.clone(),
    bobber.position.clone(),
  ]).getPoints(56));
  if (playState.cast && playState.castProgress > 0.96) {
    playState.tension = Math.max(0, playState.tension + (playState.bite ? 0.010 : -0.003));
    const biteSignal = Math.sin(elapsed * 1.7 + 0.8) > 0.985 || Math.sin(elapsed * 0.63) > 0.994;
    if (!playState.bite && biteSignal) {
      playState.bite = true;
      playState.biteUntil = elapsed + 3.2;
      readout.textContent = 'bite / space reels';
      vibrate([24, 40, 24]);
      refreshPlayHud();
    }
    if (playState.bite && elapsed > playState.biteUntil) {
      playState.bite = false;
      playState.tension = 0;
      readout.textContent = 'bite missed / line still out';
      refreshPlayHud();
    }
  }
  bobber.scale.setScalar(playState.bite ? 1.0 + Math.sin(elapsed * 18.0) * 0.16 : 1.0);
  const target = viewTargets[playState.view];
  camera.position.x += (target.pos.x + pointerX * 1.5 - camera.position.x) * 0.026;
  camera.position.y += (target.pos.y - pointerY * 0.62 - camera.position.y) * 0.026;
  camera.position.z += (target.pos.z - camera.position.z) * 0.026;
  camera.lookAt(target.look);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
