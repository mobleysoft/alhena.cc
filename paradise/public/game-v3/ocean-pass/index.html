<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Paradise Ocean Pass</title>
<style>
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #06111a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body data-water-system="paradise-pandorachat-webgl2-jonswap-ocean-v6">
<canvas id="ocean"></canvas>
<script>
const canvas = document.getElementById('ocean');
const query = new URLSearchParams(location.search);
const palettes = {
  dawn: { skyTint: [0.060, 0.180, 0.300], zenith: [0.16,0.45,0.66], horizon: [1.00,0.70,0.32], sun: [1.00,0.86,0.52], waterDeep: [0.000,0.018,0.068], waterShallow: [0.000,0.320,0.440], waterCrest: [0.30,0.76,0.92], sunDir: [0.50,0.22,0.62], gold: 0.82, exposure: 1.10 },
  noon: { skyTint: [0.080, 0.300, 0.520], zenith: [0.18,0.58,0.94], horizon: [0.80,0.96,1.00], sun: [1.00,0.96,0.80], waterDeep: [0.000,0.026,0.100], waterShallow: [0.018,0.440,0.580], waterCrest: [0.40,0.86,1.00], sunDir: [0.22,0.55,0.62], gold: 0.36, exposure: 1.14 },
  sunset: { skyTint: [0.110, 0.075, 0.180], zenith: [0.18,0.10,0.28], horizon: [1.00,0.50,0.26], sun: [1.00,0.48,0.28], waterDeep: [0.004,0.014,0.050], waterShallow: [0.120,0.220,0.300], waterCrest: [0.64,0.52,0.45], sunDir: [0.60,0.12,0.56], gold: 1.10, exposure: 1.03 },
  night: { skyTint: [0.010, 0.026, 0.070], zenith: [0.015,0.035,0.095], horizon: [0.14,0.24,0.36], sun: [0.65,0.82,1.00], waterDeep: [0.000,0.006,0.025], waterShallow: [0.018,0.120,0.180], waterCrest: [0.18,0.36,0.48], sunDir: [0.56,0.18,0.60], gold: 0.12, exposure: 0.72 },
};
const weathers = {
  calm: { wind: 4.8, chop: 1.18, foamT: 0.46, haze: 0.03, cloud: 0.04, scatter: 0.72 },
  breeze: { wind: 9.6, chop: 1.72, foamT: 0.37, haze: 0.04, cloud: 0.10, scatter: 0.90 },
  overcast: { wind: 7.0, chop: 1.34, foamT: 0.45, haze: 0.28, cloud: 0.66, scatter: 0.64 },
  storm: { wind: 15.8, chop: 2.20, foamT: 0.32, haze: 0.38, cloud: 0.86, scatter: 1.08 },
};
const timeKey = palettes[query.get('time')] ? query.get('time') : 'dawn';
const weatherKey = weathers[query.get('weather')] ? query.get('weather') : 'breeze';
const palette = palettes[timeKey];
const weather = weathers[weatherKey];

let gl = canvas.getContext('webgl2', {
  antialias: false,
  alpha: false,
  depth: false,
  stencil: false,
  premultipliedAlpha: false,
  powerPreference: 'high-performance'
});
if (!gl) gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false });
if (!gl) {
  document.body.style.background = 'linear-gradient(#174969 0%, #ffc977 42%, #0b6d85 43%, #032134 100%)';
  throw new Error('WebGL unavailable');
}
const isWebGL2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext;

const vertexSource = isWebGL2 ? `#version 300 es
precision highp float;
in vec2 a_position;
out vec2 v_uv;
void main() {
  v_uv = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}` : `
attribute vec2 a_position;
varying vec2 v_uv;
void main() {
  v_uv = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;

const fragmentBody = `
precision highp float;
${isWebGL2 ? 'in vec2 v_uv; out vec4 fragColor;' : 'varying vec2 v_uv;'}
uniform float u_time;
uniform vec2 u_resolution;
uniform float u_wind;
uniform float u_chop;
uniform float u_foamT;
uniform float u_haze;
uniform float u_cloud;
uniform float u_scatter;
uniform float u_goldHorizon;
uniform float u_exposure;
uniform vec3 u_skyTint;
uniform vec3 u_zenith;
uniform vec3 u_horizon;
uniform vec3 u_sunColor;
uniform vec3 u_waterDeep;
uniform vec3 u_waterShallow;
uniform vec3 u_waterCrest;
uniform vec3 u_sunDir;

#define PI 3.14159265359
#define TAU 6.28318530718
#define N 36
const float gravity = 9.81;

float hash1(float n) { return fract(sin(n) * 43758.5453123); }
float hash1v(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash1v(i), hash1v(i + vec2(1.0, 0.0)), u.x), mix(hash1v(i + vec2(0.0, 1.0)), hash1v(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += noise(p) * a;
    p = mat2(1.62, -1.05, 1.05, 1.62) * p + 8.71;
    a *= 0.52;
  }
  return v;
}
vec2 waveDir(int i) {
  float t = float(i) / float(N - 1);
  float spread = mix(1.04, 0.16, smoothstep(0.0, 1.0, t));
  float theta = -PI * 0.5 + (t - 0.5) * PI * spread + 0.22 + (hash1(float(i) * 9.81) - 0.5) * 0.22;
  return normalize(vec2(cos(theta), sin(theta)));
}
void waveParms(int i, float windSpeed, out float omega, out float amp, out float phase) {
  float omegaP = 0.13 * gravity / max(windSpeed, 1.0) * TAU;
  float t = float(i) / float(N - 1);
  float omegaMin = omegaP * 0.46;
  float omegaMax = omegaP * 4.45;
  omega = omegaMin * pow(omegaMax / omegaMin, t);
  float sigma = omega <= omegaP ? 0.07 : 0.09;
  float r = exp(-pow(omega - omegaP, 2.0) / (2.0 * sigma * sigma * omegaP * omegaP));
  float S = 0.0081 * gravity * gravity / pow(omega, 5.0) * exp(-1.25 * pow(omegaP / omega, 4.0)) * pow(3.3, r);
  float dOmega = (omegaMax - omegaMin) / float(N);
  float longSet = mix(1.20, 0.72, smoothstep(0.44, 1.0, t));
  amp = clamp(sqrt(2.0 * S * dOmega) * 0.62 * windSpeed / 10.0 * longSet, 0.0, 2.40);
  phase = hash1(float(i) * 17.31 + 0.73) * TAU;
}
float oceanHeight(vec2 pos, float t, float windSpeed, float chop) {
  float h = 0.0;
  for (int i = 0; i < N; i++) {
    float omega, amp, phase;
    waveParms(i, windSpeed, omega, amp, phase);
    float k = omega * omega / gravity;
    vec2 dir = waveDir(i);
    float w = dot(dir, pos) * k - omega * t + phase;
    h += amp * sin(w);
  }
  float capillary = (fbm(pos * vec2(0.85, 2.40) + vec2(t * 0.11, -t * 0.05)) - 0.5) * 0.045 * chop;
  float ripples = sin(pos.x * 19.0 + pos.y * 4.8 - t * 2.4) * 0.012;
  ripples += sin(pos.x * -7.5 + pos.y * 23.0 + t * 1.9) * 0.009;
  return h * chop + capillary + ripples * smoothstep(0.7, 2.2, chop);
}
vec3 oceanNormal(vec2 pos, float t, float windSpeed, float chop) {
  float eps = 0.035;
  float hc = oceanHeight(pos, t, windSpeed, chop);
  float hx = oceanHeight(pos + vec2(eps, 0.0), t, windSpeed, chop);
  float hy = oceanHeight(pos + vec2(0.0, eps), t, windSpeed, chop);
  return normalize(vec3(-(hx - hc) / eps, 1.0, -(hy - hc) / eps));
}
float laplacian(vec2 pos, float t, float windSpeed, float chop) {
  float eps = 0.08;
  float hc = oceanHeight(pos, t, windSpeed, chop);
  float hx1 = oceanHeight(pos + vec2(eps, 0.0), t, windSpeed, chop);
  float hx2 = oceanHeight(pos - vec2(eps, 0.0), t, windSpeed, chop);
  float hy1 = oceanHeight(pos + vec2(0.0, eps), t, windSpeed, chop);
  float hy2 = oceanHeight(pos - vec2(0.0, eps), t, windSpeed, chop);
  return (hx1 + hx2 + hy1 + hy2 - 4.0 * hc) / (eps * eps);
}
float fresnelSchlick(float cosTheta) {
  return 0.0204 + 0.9796 * pow(clamp(1.0 - cosTheta, 0.0, 1.0), 5.0);
}
vec3 acesTone(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
vec3 skyFromDir(vec3 r) {
  float y = clamp(r.y * 0.5 + 0.5, 0.0, 1.0);
  vec3 sky = mix(u_horizon, u_zenith, smoothstep(0.08, 0.80, y));
  sky = mix(sky, u_skyTint * 2.2 + vec3(0.018,0.035,0.090), smoothstep(0.72, 1.0, y));
  float sunDot = dot(normalize(r), normalize(u_sunDir));
  sky += u_sunColor * smoothstep(0.992, 0.999, sunDot) * 2.4;
  sky += u_sunColor * smoothstep(0.82, 0.995, sunDot) * (0.13 + u_goldHorizon * 0.20);
  return sky;
}
vec3 skyScreen(vec2 uv, vec2 ndc, float horizonY) {
  float t = clamp((ndc.y - horizonY) / (1.0 - horizonY), 0.0, 1.0);
  vec3 sky = mix(u_horizon, u_zenith, smoothstep(0.0, 0.72, t));
  sky = mix(sky, u_skyTint * 2.3 + vec3(0.02,0.04,0.10), smoothstep(0.66, 1.0, t));
  vec2 sunPos = vec2(0.43 + u_sunDir.x * 0.17, 0.48 + u_sunDir.y * 0.32);
  float sunDist = distance(uv, sunPos);
  sky += u_sunColor * exp(-sunDist * 15.0) * (0.46 + u_goldHorizon * 0.44);
  sky += u_sunColor * exp(-sunDist * 3.3) * (0.08 + u_goldHorizon * 0.12);
  float clouds = smoothstep(0.50, 0.82, fbm(vec2(uv.x * 3.2 + u_time * 0.010, uv.y * 5.4 - u_time * 0.006)));
  clouds *= smoothstep(0.12, 0.88, t) * u_cloud;
  sky = mix(sky, mix(vec3(0.92,0.96,0.98), vec3(0.36,0.42,0.48), u_haze), clouds * 0.24);
  vec2 starGrid = uv * u_resolution.xy / 16.0;
  vec2 starCell = floor(starGrid);
  vec2 starUv = fract(starGrid) - 0.5;
  float starSeed = hash1v(starCell);
  float starRadius = mix(0.032, 0.070, hash1v(starCell + 13.7));
  float starDisc = smoothstep(starRadius, 0.0, length(starUv));
  float night = smoothstep(0.20, 0.0, length(u_zenith));
  float stars = step(0.992, starSeed) * starDisc * night * (1.0 - u_cloud * 0.72);
  sky += vec3(0.82,0.91,1.0) * stars * 0.58;
  return sky;
}
void emit(vec3 color) {
  color = mix(color, vec3(0.58,0.66,0.70), u_haze * 0.10);
  float vignette = smoothstep(1.08, 0.18, length((v_uv - 0.5) * vec2(1.02, 0.84)));
  color *= 0.78 + vignette * 0.30;
  color = acesTone(color * u_exposure);
  color = pow(color, vec3(0.4545));
  ${isWebGL2 ? 'fragColor = vec4(color, 1.0);' : 'gl_FragColor = vec4(color, 1.0);'}
}
void main() {
  vec2 uv = v_uv;
  vec2 ndc = uv * 2.0 - 1.0;
  ndc.x *= u_resolution.x / u_resolution.y;
  float horizonY = 0.155;
  float aboveHorizon = ndc.y - horizonY;
  if (aboveHorizon > 0.0) {
    emit(skyScreen(uv, ndc, horizonY));
    return;
  }

  float waterT = clamp(-aboveHorizon / (1.0 - horizonY + 0.001), 0.0, 1.0);
  float dist = mix(0.45, 135.0, pow(waterT, 1.86));
  vec3 camPos = vec3(0.0, 2.15, 0.0);
  vec3 rayDir = normalize(vec3(ndc.x * 0.76, -0.28 - waterT * 0.82, -1.0));
  float planeT = -camPos.y / min(rayDir.y, -0.04);
  vec2 worldPos = (camPos.xz + rayDir.xz * planeT) * 0.086;
  worldPos += vec2(u_time * 0.006, u_time * 0.010);
  worldPos += vec2(fbm(worldPos * 0.18 + vec2(5.0, u_time * 0.015)), fbm(worldPos * 0.15 + vec2(-4.0, -u_time * 0.012))) * 0.12;

  float h = oceanHeight(worldPos, u_time, u_wind, u_chop);
  vec3 nrm = oceanNormal(worldPos, u_time, u_wind, u_chop);
  float lap = laplacian(worldPos, u_time, u_wind, u_chop);
  vec3 viewDir = normalize(-rayDir);
  vec3 reflected = skyFromDir(reflect(-viewDir, nrm));
  float fresnel = fresnelSchlick(max(dot(nrm, viewDir), 0.0));
  float hNorm = clamp(h * 0.42 + 0.50, 0.0, 1.0);
  float depth = smoothstep(0.0, 1.0, waterT);
  vec3 body = mix(u_waterDeep, u_waterShallow, smoothstep(0.06, 0.82, depth));
  vec3 sandScatter = vec3(0.82, 0.68, 0.38) * smoothstep(0.72, 1.0, depth) * (0.16 + u_scatter * 0.10);
  body += sandScatter;
  body = mix(body, u_waterCrest, pow(hNorm, 3.0) * 0.42);
  float sss = clamp(lap * 0.12, 0.0, 1.0);
  float backLight = pow(max(dot(nrm, normalize(vec3(-u_sunDir.x, 0.34, -u_sunDir.z))), 0.0), 1.7);
  body += vec3(0.00, 0.52, 0.54) * sss * u_scatter * 0.36;
  body += vec3(0.08, 0.52, 0.48) * backLight * depth * u_scatter * 0.16;
  vec3 water = mix(body, reflected, clamp(fresnel * 1.12, 0.0, 0.88));

  vec3 sunDir = normalize(u_sunDir);
  vec3 halfV = normalize(viewDir + sunDir);
  float sparkleField = smoothstep(0.50, 0.92, fbm(worldPos * vec2(8.0, 1.7) + vec2(u_time * 0.35, -u_time * 0.10)));
  float sunPath = pow(max(0.0, 1.0 - abs(uv.x - (0.43 + u_sunDir.x * 0.17)) * 4.1), 3.2) * smoothstep(0.05, 0.75, waterT);
  float spec = pow(max(dot(nrm, halfV), 0.0), 72.0) * sparkleField * sunPath * (2.2 + u_chop * 1.1);
  water += u_sunColor * spec * (0.70 + u_goldHorizon);
  float caustic = pow(0.5 + 0.5 * sin(worldPos.x * 12.0 + fbm(worldPos * 2.0) * 5.5 - u_time * 1.1), 9.0);
  caustic *= pow(0.5 + 0.5 * sin(worldPos.y * 10.5 - worldPos.x * 2.0 + u_time * 0.9), 5.0);
  water += vec3(0.52, 0.86, 0.78) * caustic * smoothstep(0.62, 1.0, waterT) * (0.035 + u_scatter * 0.035);

  float foamBase = smoothstep(u_foamT * 0.78, u_foamT * 1.20, abs(h));
  float foamNoise = smoothstep(0.34, 0.76, fbm(worldPos * vec2(10.0, 4.2) + vec2(u_time * 0.06, -u_time * 0.045)));
  float crestFoam = foamBase * foamNoise * smoothstep(0.08, 0.96, waterT);
  float shoreWave = 0.84 + sin(worldPos.x * 2.5 + u_time * 1.05) * 0.018 + fbm(vec2(worldPos.x * 1.1, u_time * 0.22)) * 0.018;
  float shoreFoam = smoothstep(0.044, 0.0, abs(waterT - shoreWave)) * smoothstep(0.28, 0.80, foamNoise);
  float lace = smoothstep(0.64, 0.92, fbm(worldPos * vec2(1.8, 11.5) + vec2(-u_time * 0.08, u_time * 0.18)));
  float foam = clamp((crestFoam * (0.42 + lace * 0.58) + shoreFoam * 0.92) * (1.15 - u_foamT), 0.0, 1.0);
  vec3 foamColor = vec3(0.88, 0.96, 1.0);
  water = mix(water, foamColor, foam * 0.78);
  float ridgePhase = worldPos.y * 5.8 + h * 2.2 - u_time * (0.55 + u_wind * 0.025);
  float ridge = pow(1.0 - abs(sin(ridgePhase)), 14.0);
  ridge *= smoothstep(0.08, 0.94, waterT) * (1.0 - smoothstep(0.94, 1.0, waterT));
  float crossRidge = pow(1.0 - abs(sin(worldPos.x * 7.2 + worldPos.y * 1.1 + u_time * 0.22)), 20.0);
  float perspectivePhase = pow(waterT, 1.38) * 78.0 + ndc.x * 2.2 + h * 3.1 - u_time * (0.52 + u_wind * 0.018);
  float perspectiveRidge = pow(1.0 - abs(sin(perspectivePhase)), 9.0);
  float perspectiveMask = smoothstep(0.05, 0.80, waterT) * (1.0 - smoothstep(0.96, 1.0, waterT));
  float shadowBand = smoothstep(0.14, 0.88, sin(perspectivePhase - 0.82) * 0.5 + 0.5) * perspectiveMask;
  water = mix(water, water * vec3(0.48, 0.68, 0.76), shadowBand * (0.16 + u_chop * 0.10));
  water += vec3(0.14, 0.38, 0.48) * ridge * (0.28 + u_chop * 0.22);
  water += vec3(0.70, 0.96, 1.0) * perspectiveRidge * perspectiveMask * (0.08 + u_chop * 0.08);
  float swellShadow = smoothstep(0.2, 1.0, sin(worldPos.y * 1.6 + h * 1.4 - u_time * 0.42) * 0.5 + 0.5);
  water = mix(water, water * vec3(0.58, 0.72, 0.82), swellShadow * perspectiveMask * (0.10 + u_chop * 0.06));
  water += vec3(0.94, 0.99, 1.0) * ridge * crossRidge * (0.16 + u_chop * 0.15);
  float foamEdge = abs(foam - crestFoam);
  water += vec3(0.04,0.0,0.0) * foamEdge * abs(h - oceanHeight(worldPos + vec2(0.002,0.0), u_time, u_wind, u_chop)) * 9.0;
  water += vec3(0.0,0.0,0.055) * foamEdge * abs(h - oceanHeight(worldPos - vec2(0.002,0.0), u_time, u_wind, u_chop)) * 9.0;

  float trough = smoothstep(0.62, 0.94, fbm(vec2(worldPos.x * 0.36 - u_time * 0.02, worldPos.y * 2.2 + u_time * 0.11)));
  water = mix(water, water * vec3(0.56,0.78,0.88), trough * smoothstep(0.05, 0.88, 1.0 - waterT) * 0.26);
  float fogT = clamp((dist - 6.0) / 92.0, 0.0, 1.0);
  vec3 fogColor = mix(u_horizon, u_skyTint + vec3(0.06,0.10,0.16), 0.38 + u_haze * 0.28);
  water = mix(water, fogColor, pow(fogT, 1.25) * (0.12 + u_haze * 0.34));
  float seam = 1.0 - clamp(-aboveHorizon * 18.0, 0.0, 1.0);
  water = mix(water, mix(fogColor, u_horizon, 0.52), seam * 0.52);
  emit(water);
}`;
const fragmentSource = isWebGL2 ? `#version 300 es
${fragmentBody}` : fragmentBody;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader));
  }
  return shader;
}
const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);

const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'a_position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uniformNames = ['time','resolution','wind','chop','foamT','haze','cloud','scatter','goldHorizon','exposure','skyTint','zenith','horizon','sunColor','waterDeep','waterShallow','waterCrest','sunDir'];
const u = Object.fromEntries(uniformNames.map(name => [name, gl.getUniformLocation(program, `u_${name}`)]));

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
function v3(loc, value) { gl.uniform3f(loc, value[0], value[1], value[2]); }
function frame(now) {
  gl.useProgram(program);
  gl.uniform1f(u.time, now * 0.001);
  gl.uniform2f(u.resolution, canvas.width, canvas.height);
  gl.uniform1f(u.wind, weather.wind);
  gl.uniform1f(u.chop, weather.chop);
  gl.uniform1f(u.foamT, weather.foamT);
  gl.uniform1f(u.haze, weather.haze);
  gl.uniform1f(u.cloud, weather.cloud);
  gl.uniform1f(u.scatter, weather.scatter);
  gl.uniform1f(u.goldHorizon, palette.gold);
  gl.uniform1f(u.exposure, palette.exposure);
  v3(u.skyTint, palette.skyTint);
  v3(u.zenith, palette.zenith);
  v3(u.horizon, palette.horizon);
  v3(u.sunColor, palette.sun);
  v3(u.waterDeep, palette.waterDeep);
  v3(u.waterShallow, palette.waterShallow);
  v3(u.waterCrest, palette.waterCrest);
  v3(u.sunDir, palette.sunDir);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
